<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Meu App de Música</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }

        /* ===== TELA DE ABERTURA (SPLASH SCREEN) ===== */
        .splash-screen {
            position: fixed;
            inset: 0;
            background: #000; /* Fundo preto combina com a arte neon */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .splash-screen.escondido {
            opacity: 0;
            visibility: hidden;
        }

        .splash-screen img {
            width: 100%;
            max-width: 380px; /* Tamanho máximo da imagem */
            height: auto;
            border-radius: 30px;
            box-shadow: 0 0 40px rgba(233, 69, 96, 0.3); /* Brilho suave */
            animation: zoomSuave 2.5s ease-out forwards;
        }

        @keyframes zoomSuave {
            0% { transform: scale(0.85); opacity: 0; }
            30% { transform: scale(1); opacity: 1; }
            80% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .player {
            background: rgba(30, 30, 50, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 25px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            /* Começa escondido e aparece após o splash */
            opacity: 0;
            animation: aparecerPlayer 0.5s ease forwards;
            animation-delay: 2.2s;
        }

        @keyframes aparecerPlayer {
            to { opacity: 1; }
        }

        /* ===== Abas ===== */
        .abas {
            display: flex;
            gap: 5px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 5px;
            margin-bottom: 15px;
        }

        .aba {
            flex: 1;
            padding: 10px 8px;
            border: none;
            background: transparent;
            color: #b0b0c0;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .aba:hover { color: #fff; }

        .aba.ativa {
            background: linear-gradient(135deg, #e94560, #903749);
            color: #fff;
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
        }

        .aba .badge {
            background: rgba(255, 255, 255, 0.25);
            padding: 1px 7px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .aba.ativa .badge { background: rgba(255, 255, 255, 0.35); }

        /* ===== Barra de busca ===== */
        .busca-container {
            position: relative;
            margin-bottom: 15px;
            display: none;
        }

        .busca-container.visivel {
            display: block;
            animation: fadeIn 0.25s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .busca-container .lupa {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            color: #b0b0c0;
            pointer-events: none;
        }

        .busca-container input {
            width: 100%;
            padding: 11px 40px 11px 42px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
        }

        .busca-container input::placeholder { color: #7a7a90; }

        .busca-container input:focus {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.08);
            box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.15);
        }

        .busca-container .btn-limpar-busca {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #888;
            font-size: 1rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 50%;
            display: none;
            transition: all 0.2s;
            outline: none;
        }

        .busca-container .btn-limpar-busca:hover {
            color: #ff5577;
            background: rgba(255, 85, 119, 0.15);
        }

        .busca-container .btn-limpar-busca.visivel { display: block; }

        .busca-container .atalho {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.7rem;
            color: #666;
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
        }

        .busca-container input:focus ~ .atalho,
        .busca-container input:not(:placeholder-shown) ~ .atalho {
            display: none;
        }

        /* ===== Painéis ===== */
        .painel { display: none; }
        .painel.ativo { display: block; animation: fadeIn 0.3s; }

        /* ===== Player ===== */
        .capa {
            width: 100%;
            height: 240px;
            border-radius: 20px;
            background: linear-gradient(135deg, #e94560, #903749);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 70px;
            margin-bottom: 20px;
            box-shadow: 0 15px 35px rgba(233, 69, 96, 0.3);
            transition: transform 0.3s;
            overflow: hidden;
            position: relative;
        }

        .capa img { width: 100%; height: 100%; object-fit: cover; }
        .capa.tocando { animation: pulsar 2s infinite ease-in-out; }

        @keyframes pulsar {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .info { text-align: center; margin-bottom: 20px; }

        .titulo {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artista {
            font-size: 0.9rem;
            color: #b0b0c0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .barra-progresso {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            cursor: pointer;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .progresso {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #e94560, #ff6b8a);
            border-radius: 3px;
            transition: width 0.1s linear;
        }

        .tempos {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #b0b0c0;
            margin-bottom: 18px;
        }

        .controles {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 1.15rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
        }

        .btn:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.08); }
        .btn:focus { outline: none; }

        .btn:focus-visible {
            box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.5);
        }

        .btn-shuffle {
            width: 42px;
            height: 42px;
            font-size: 1rem;
            color: #b0b0c0;
        }

        .btn-shuffle.ativo {
            background: linear-gradient(135deg, #e94560, #903749);
            color: #fff;
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
        }

        .btn-shuffle.ativo::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
        }

        .btn-play {
            width: 66px;
            height: 66px;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #e94560, #903749);
            box-shadow: 0 8px 20px rgba(233, 69, 96, 0.4);
        }

        .btn-play:hover { background: linear-gradient(135deg, #ff5577, #a04558); }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .volume-container span { font-size: 1.05rem; }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 5px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px; height: 15px;
            background: #e94560;
            border-radius: 50%;
            cursor: pointer;
        }

        .btn-adicionar {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 2px dashed rgba(233, 69, 96, 0.6);
            background: rgba(233, 69, 96, 0.1);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-adicionar:hover {
            background: rgba(233, 69, 96, 0.25);
            border-color: #e94560;
            transform: translateY(-2px);
        }

        .lista-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: #b0b0c0;
        }

        .btn-limpar {
            background: transparent;
            border: none;
            color: #ff6b8a;
            cursor: pointer;
            font-size: 0.8rem;
            text-decoration: underline;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-limpar:hover { color: #ff5577; }

        .lista {
            max-height: 260px;
            overflow-y: auto;
        }

        .lista::-webkit-scrollbar { width: 6px; }
        .lista::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .musica-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            gap: 12px;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .musica-item:hover { background: rgba(255, 255, 255, 0.08); }

        .musica-item.ativa {
            background: rgba(233, 69, 96, 0.2);
            border-left: 3px solid #e94560;
        }

        .musica-item .icone {
            font-size: 1.2rem;
            flex-shrink: 0;
            width: 42px;
            height: 42px;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(233, 69, 96, 0.2);
        }

        .musica-item .icone img { width: 100%; height: 100%; object-fit: cover; }
        .musica-item .dados { flex: 1; min-width: 0; }

        .musica-item .nome {
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .musica-item .duracao {
            font-size: 0.75rem;
            color: #b0b0c0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .musica-item mark {
            background: rgba(255, 215, 0, 0.35);
            color: #fff;
            padding: 0 2px;
            border-radius: 3px;
        }

        .btn-remover {
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
            flex-shrink: 0;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-remover:hover {
            color: #ff5577;
            background: rgba(255, 85, 119, 0.15);
        }

        .vazio {
            text-align: center;
            padding: 35px 20px;
            color: #888;
        }

        .vazio .icone-grande {
            font-size: 3rem;
            display: block;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .vazio .txt { font-size: 0.9rem; margin-bottom: 5px; }
        .vazio .sub { font-size: 0.75rem; color: #666; }

        .dropzone {
            display: none;
            border: 2px dashed rgba(233, 69, 96, 0.5);
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            color: #b0b0c0;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .dropzone.visivel { display: block; }
        .dropzone:hover, .dropzone.arrastando {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.1);
        }

        .dropzone .icone-grande {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 10px;
        }

        .modal-fundo {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-fundo.aberto { display: flex; }

        .modal {
            background: #1e1e32;
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 380px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal::-webkit-scrollbar { width: 6px; }
        .modal::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .modal h3 {
            margin-bottom: 18px;
            font-size: 1.1rem;
            text-align: center;
        }

        .modal label {
            display: block;
            font-size: 0.8rem;
            color: #b0b0c0;
            margin-bottom: 6px;
            margin-top: 12px;
        }

        .modal input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .modal input[type="text"]:focus { border-color: #e94560; }

        .capa-editor {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        .capa-preview {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background: linear-gradient(135deg, #e94560, #903749);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .capa-preview img { width: 100%; height: 100%; object-fit: cover; }

        .capa-acoes {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .btn-capa {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-capa:hover {
            background: rgba(233, 69, 96, 0.15);
            border-color: #e94560;
        }

        .btn-capa.remover {
            color: #ff6b8a;
            border-color: rgba(255, 107, 138, 0.3);
        }

        .btn-capa.remover:hover {
            background: rgba(255, 85, 119, 0.15);
            border-color: #ff5577;
        }

        .aviso-capa {
            font-size: 0.7rem;
            color: #888;
            margin-top: 6px;
        }

        .aviso-capa.detectada { color: #4cd964; }

        .modal .preview { margin-top: 18px; }
        .modal .preview audio { width: 100%; height: 40px; border-radius: 10px; }

        .modal .info-fila {
            text-align: center;
            font-size: 0.75rem;
            color: #b0b0c0;
            margin-top: 10px;
        }

        .modal-botoes {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-botoes button {
            flex: 1;
            padding: 11px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-cancelar {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-cancelar:hover { background: rgba(255, 255, 255, 0.2); }

        .btn-salvar {
            background: linear-gradient(135deg, #e94560, #903749);
            color: #fff;
        }

        .btn-salvar:hover {
            background: linear-gradient(135deg, #ff5577, #a04558);
        }

        .status-salvo {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(40, 200, 100, 0.95);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
            z-index: 200;
        }

        .status-salvo.visivel { transform: translateX(-50%) translateY(0); }

        .status-salvo.shuffle {
            background: rgba(255, 140, 60, 0.95);
        }

        .dica {
            font-size: 0.72rem;
            color: #888;
            text-align: center;
            margin-top: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- TELA DE ABERTURA (SPLASH SCREEN) -->
    <!-- SUBSTITUA "URL_DA_SUA_IMAGEM_AQUI" PELO LINK OU CAMINHO DA SUA IMAGEM -->
    <div class="splash-screen" id="splashScreen">
        <img src="URL_DA_SUA_IMAGEM_AQUI" alt="Carregando...">
    </div>

    <div class="player">

        <!-- ABAS -->
        <div class="abas">
            <button class="aba ativa" data-aba="minhas">
                🎧 Minhas <span class="badge" id="badgeMinhas">0</span>
            </button>
            <button class="aba" data-aba="tocando">
                ▶ Tocando
            </button>
        </div>

        <!-- BARRA DE BUSCA -->
        <div class="busca-container visivel" id="buscaContainer">
            <span class="lupa">🔍</span>
            <input type="text" id="inputBusca" placeholder="Buscar por título ou artista..." autocomplete="off">
            <span class="atalho">Ctrl K</span>
            <button class="btn-limpar-busca" id="btnLimparBusca" title="Limpar busca">✕</button>
        </div>

        <!-- PAINEL 1 — MINHAS MÚSICAS -->
        <div class="painel ativo" id="painel-minhas">
            <button class="btn-adicionar" id="btnAdicionar">➕ Adicionar músicas</button>
            <input type="file" id="inputArquivo" accept="audio/*" multiple hidden>

            <div class="lista-header" id="listaHeader" style="display:none;">
                <span id="contadorMusicas">0 músicas</span>
                <button class="btn-limpar" id="btnLimpar">Limpar tudo</button>
            </div>

            <div class="lista" id="listaMinhas"></div>

            <div class="dropzone" id="dropzone">
                <span class="icone-grande">🎧</span>
                Arraste arquivos de áudio aqui<br>ou use o botão acima
            </div>

            <div class="dica">💾 Suas músicas ficam salvas no navegador<br>mesmo depois de fechar</div>
        </div>

        <!-- PAINEL 2 — TOCANDO AGORA -->
        <div class="painel" id="painel-tocando">
            <div class="capa" id="capa">🎵</div>

            <div class="info">
                <div class="titulo" id="titulo">Nenhuma música</div>
                <div class="artista" id="artista">—</div>
            </div>

            <div class="barra-progresso" id="barraProgresso">
                <div class="progresso" id="progresso"></div>
            </div>
            <div class="tempos">
                <span id="tempoAtual">0:00</span>
                <span id="tempoTotal">0:00</span>
            </div>

            <!-- Controles com botão de shuffle -->
            <div class="controles">
                <button class="btn btn-shuffle" id="btnShuffle" title="Reprodução aleatória">🔀</button>
                <button class="btn" id="btnAnterior" title="Anterior">⏮</button>
                <button class="btn btn-play" id="btnPlay" title="Play/Pause">▶</button>
                <button class="btn" id="btnProximo" title="Próxima">⏭</button>
            </div>

            <div class="volume-container">
                <span>🔊</span>
                <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7">
            </div>

            <div class="dica" id="infoFonteTocando">—</div>
        </div>

        <audio id="audio"></audio>
    </div>

    <!-- MODAL -->
    <div class="modal-fundo" id="modalFundo">
        <div class="modal">
            <h3>🎵 Detalhes da música</h3>

            <label>Capa</label>
            <div class="capa-editor">
                <div class="capa-preview" id="capaPreview">🎵</div>
                <div class="capa-acoes">
                    <button type="button" class="btn-capa" id="btnEscolherCapa">📷 Escolher imagem</button>
                    <button type="button" class="btn-capa remover" id="btnRemoverCapa" style="display:none;">🗑 Remover capa</button>
                </div>
            </div>
            <div class="aviso-capa" id="avisoCapa"></div>
            <input type="file" id="inputCapa" accept="image/*" hidden>

            <label for="inputTitulo">Título</label>
            <input type="text" id="inputTitulo" placeholder="Nome da música">

            <label for="inputArtista">Artista</label>
            <input type="text" id="inputArtista" placeholder="Nome do artista">

            <div class="preview">
                <audio id="previewAudio" controls></audio>
            </div>
            <div class="info-fila" id="infoFila"></div>
            <div class="modal-botoes">
                <button class="btn-cancelar" id="btnCancelarModal">Cancelar</button>
                <button class="btn-salvar" id="btnSalvarModal">Salvar</button>
            </div>
        </div>
    </div>

    <div class="status-salvo" id="statusSalvo">✓ Música salva</div>

    <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>

    <script>
        // ============================================================
        //  SPLASH SCREEN
        // ============================================================
        window.addEventListener('load', () => {
            // Esconde a tela de abertura após 2.5 segundos
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                splash.classList.add('escondido');
                // Remove do DOM após a transição terminar
                setTimeout(() => splash.remove(), 600);
            }, 2500);
        });

        // ============================================================
        //  BANCO DE DADOS (IndexedDB)
        // ============================================================
        const DB_NOME = 'AppMusicaDB';
        const DB_VERSAO = 1;
        const STORE = 'musicas';
        let db = null;

        function abrirDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NOME, DB_VERSAO);
                req.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains(STORE)) {
                        const store = database.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
                        store.createIndex('ordem', 'ordem');
                    }
                };
                req.onsuccess = (e) => { db = e.target.result; resolve(db); };
                req.onerror = (e) => reject(e.target.error);
            });
        }

        function listarMusicasDB() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE, 'readonly');
                const req = tx.objectStore(STORE).getAll();
                req.onsuccess = () => resolve(req.result.sort((a, b) => (a.ordem || 0) - (b.ordem || 0)));
                req.onerror = () => reject(req.error);
            });
        }

        function adicionarMusicaDB(musica) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE, 'readwrite');
                const req = tx.objectStore(STORE).add(musica);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function removerMusicaDB(id) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE, 'readwrite');
                const req = tx.objectStore(STORE).delete(id);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        function limparDB() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE, 'readwrite');
                const req = tx.objectStore(STORE).clear();
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        // ============================================================
        //  ESTADO
        // ============================================================
        let musicas = [];
        let indiceAtual = 0;
        let arquivosTemp = [];
        let objectURLs = {};
        let capaURLs = {};
        let termoBusca = '';
        let capaTemp = null;

        // ===== Estado do shuffle =====
        let shuffleAtivo = false;
        let ordemShuffle = [];
        let posicaoShuffle = 0;
        let historicoShuffle = [];

        // ============================================================
        //  ELEMENTOS
        // ============================================================
        const audio = document.getElementById('audio');
        const capa = document.getElementById('capa');
        const titulo = document.getElementById('titulo');
        const artista = document.getElementById('artista');
        const btnPlay = document.getElementById('btnPlay');
        const btnAnterior = document.getElementById('btnAnterior');
        const btnProximo = document.getElementById('btnProximo');
        const btnShuffle = document.getElementById('btnShuffle');
        const progresso = document.getElementById('progresso');
        const barraProgresso = document.getElementById('barraProgresso');
        const tempoAtual = document.getElementById('tempoAtual');
        const tempoTotal = document.getElementById('tempoTotal');
        const volume = document.getElementById('volume');
        const listaMinhas = document.getElementById('listaMinhas');
        const btnAdicionar = document.getElementById('btnAdicionar');
        const inputArquivo = document.getElementById('inputArquivo');
        const dropzone = document.getElementById('dropzone');
        const listaHeader = document.getElementById('listaHeader');
        const contadorMusicas = document.getElementById('contadorMusicas');
        const btnLimpar = document.getElementById('btnLimpar');
        const badgeMinhas = document.getElementById('badgeMinhas');
        const statusSalvo = document.getElementById('statusSalvo');
        const infoFonteTocando = document.getElementById('infoFonteTocando');

        const buscaContainer = document.getElementById('buscaContainer');
        const inputBusca = document.getElementById('inputBusca');
        const btnLimparBusca = document.getElementById('btnLimparBusca');

        const modalFundo = document.getElementById('modalFundo');
        const inputTitulo = document.getElementById('inputTitulo');
        const inputArtista = document.getElementById('inputArtista');
        const previewAudio = document.getElementById('previewAudio');
        const infoFila = document.getElementById('infoFila');
        const btnCancelarModal = document.getElementById('btnCancelarModal');
        const btnSalvarModal = document.getElementById('btnSalvarModal');

        const capaPreview = document.getElementById('capaPreview');
        const btnEscolherCapa = document.getElementById('btnEscolherCapa');
        const btnRemoverCapa = document.getElementById('btnRemoverCapa');
        const inputCapa = document.getElementById('inputCapa');
        const avisoCapa = document.getElementById('avisoCapa');

        // ============================================================
        //  REMOVER FOCO
        // ============================================================
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', (e) => e.preventDefault());
        });

        function blurAtivo() {
            if (document.activeElement && document.activeElement !== inputBusca) {
                document.activeElement.blur();
            }
        }

        // ============================================================
        //  ABAS
        // ============================================================
        document.querySelectorAll('.aba').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.aba').forEach(b => b.classList.remove('ativa'));
                document.querySelectorAll('.painel').forEach(p => p.classList.remove('ativo'));
                btn.classList.add('ativa');
                document.getElementById('painel-' + btn.dataset.aba).classList.add('ativo');
                btn.blur();

                const aba = btn.dataset.aba;
                if (aba === 'tocando') {
                    buscaContainer.classList.remove('visivel');
                } else {
                    buscaContainer.classList.add('visivel');
                }
            });
        });

        // ============================================================
        //  BUSCA
        // ============================================================
        inputBusca.addEventListener('input', () => {
            termoBusca = inputBusca.value.trim();
            btnLimparBusca.classList.toggle('visivel', termoBusca.length > 0);
            renderListaMinhas();
        });

        btnLimparBusca.addEventListener('click', () => {
            inputBusca.value = '';
            termoBusca = '';
            btnLimparBusca.classList.remove('visivel');
            renderListaMinhas();
            inputBusca.focus();
        });

        document.addEventListener('keydown', (e) => {
            const focoEmInput = ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName);
            const abaTocando = document.getElementById('painel-tocando').classList.contains('ativo');

            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                if (abaTocando) document.querySelector('.aba[data-aba="minhas"]').click();
                inputBusca.focus();
                inputBusca.select();
            } else if (e.key === '/' && !focoEmInput) {
                e.preventDefault();
                if (abaTocando) document.querySelector('.aba[data-aba="minhas"]').click();
                inputBusca.focus();
            } else if (e.key === 'Escape' && document.activeElement === inputBusca) {
                if (termoBusca) btnLimparBusca.click();
                else inputBusca.blur();
            }
        });

        function normalizar(txt) {
            return String(txt).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        function filtrarLista(lista) {
            if (!termoBusca) return lista.map((m, i) => ({ musica: m, indiceOriginal: i }));
            const termo = normalizar(termoBusca);
            return lista
                .map((m, i) => ({ musica: m, indiceOriginal: i }))
                .filter(({ musica }) =>
                    normalizar(musica.titulo).includes(termo) ||
                    normalizar(musica.artista).includes(termo)
                );
        }

        function destacar(texto) {
            const escapado = escapeHTML(texto);
            if (!termoBusca) return escapado;
            const termo = normalizar(termoBusca);
            const palavras = termo.split(/\s+/).filter(Boolean);
            let resultado = escapado;
            palavras.forEach(p => {
                const regex = new RegExp('(' + p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
                resultado = resultado.replace(regex, '<mark>$1</mark>');
            });
            return resultado;
        }

        // ============================================================
        //  UTILITÁRIOS
        // ============================================================
        function formatarTempo(seg) {
            if (isNaN(seg) || !isFinite(seg)) return '0:00';
            const m = Math.floor(seg / 60);
            const s = Math.floor(seg % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function escapeHTML(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[c]));
        }

        function obterURLdaMusica(musica) {
            if (!musica.blob) return null;
            if (!objectURLs[musica.id]) objectURLs[musica.id] = URL.createObjectURL(musica.blob);
            return objectURLs[musica.id];
        }

        function obterURLdaCapa(musica) {
            if (!musica.capaBlob) return null;
            if (!capaURLs[musica.id]) capaURLs[musica.id] = URL.createObjectURL(musica.capaBlob);
            return capaURLs[musica.id];
        }

        function mostrarStatus(mensagem, tipo = 'normal') {
            statusSalvo.textContent = mensagem;
            statusSalvo.className = 'status-salvo visivel' + (tipo === 'shuffle' ? ' shuffle' : '');
            clearTimeout(mostrarStatus._t);
            mostrarStatus._t = setTimeout(() => {
                statusSalvo.classList.remove('visivel');
            }, 2000);
        }

        // ============================================================
        //  SHUFFLE / ALEATÓRIO
        // ============================================================
        function gerarOrdemShuffle() {
            const indices = musicas.map((_, i) => i);
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
            ordemShuffle = indices;
            posicaoShuffle = 0;
            historicoShuffle = [];

            if (musicas.length > 0) {
                const pos = ordemShuffle.indexOf(indiceAtual);
                if (pos !== -1) {
                    [ordemShuffle[0], ordemShuffle[pos]] = [ordemShuffle[pos], ordemShuffle[0]];
                }
                posicaoShuffle = 0;
            }
        }

        function atualizarBotaoShuffle() {
            if (shuffleAtivo) {
                btnShuffle.classList.add('ativo');
                btnShuffle.title = 'Reprodução aleatória ATIVA (clique para desativar)';
            } else {
                btnShuffle.classList.remove('ativo');
                btnShuffle.title = 'Ativar reprodução aleatória';
            }
        }

        function alternarShuffle() {
            shuffleAtivo = !shuffleAtivo;

            if (shuffleAtivo) {
                gerarOrdemShuffle();
                mostrarStatus('🔀 Aleatório ativado', 'shuffle');
            } else {
                ordemShuffle = [];
                posicaoShuffle = 0;
                historicoShuffle = [];
                mostrarStatus('➡️ Ordem normal', 'normal');
            }

            atualizarBotaoShuffle();
            blurAtivo();
        }

        btnShuffle.addEventListener('click', alternarShuffle);

        // ============================================================
        //  EXTRAIR CAPA DO MP3
        // ============================================================
        function extrairCapaDoMP3(arquivo) {
            return new Promise((resolve) => {
                if (typeof jsmediatags === 'undefined') { resolve(null); return; }
                try {
                    jsmediatags.read(arquivo, {
                        onSuccess: (tag) => {
                            const pic = tag.tags.picture;
                            if (!pic) { resolve(null); return; }
                            const bytes = new Uint8Array(pic.data);
                            const blob = new Blob([bytes], { type: pic.format || 'image/jpeg' });
                            resolve(blob);
                        },
                        onError: () => resolve(null)
                    });
                } catch (e) {
                    resolve(null);
                }
            });
        }

        // ============================================================
        //  CARREGAR / TOCAR
        // ============================================================
        function carregarMusica(indice, opcoes = {}) {
            if (musicas.length === 0) {
                titulo.textContent = 'Nenhuma música';
                artista.textContent = '—';
                capa.innerHTML = '🎵';
                audio.removeAttribute('src');
                audio.load();
                progresso.style.width = '0%';
                tempoAtual.textContent = '0:00';
                tempoTotal.textContent = '0:00';
                btnPlay.textContent = '▶';
                capa.classList.remove('tocando');
                infoFonteTocando.textContent = '—';
                return;
            }
            if (indice < 0) indice = 0;
            if (indice >= musicas.length) indice = musicas.length - 1;

            const musica = musicas[indice];
            audio.src = obterURLdaMusica(musica);
            titulo.textContent = musica.titulo;
            artista.textContent = musica.artista;
            indiceAtual = indice;

            if (shuffleAtivo && !opcoes.deShuffle) {
                const pos = ordemShuffle.indexOf(indice);
                if (pos !== -1) posicaoShuffle = pos;
            }

            const capaUrl = obterURLdaCapa(musica);
            if (capaUrl) {
                capa.innerHTML = `<img src="${capaUrl}" alt="capa">`;
            } else {
                capa.textContent = musica.capa || '🎵';
            }

            const sufixoShuffle = shuffleAtivo ? ' 🔀' : '';
            infoFonteTocando.textContent = `📁 Da sua biblioteca (${indice + 1}/${musicas.length})${sufixoShuffle}`;

            renderListaMinhas();
        }

        function togglePlay() {
            if (musicas.length === 0) {
                document.querySelector('.aba[data-aba="minhas"]').click();
                btnAdicionar.click();
                return;
            }
            if (audio.paused) {
                if (!audio.src) carregarMusica(indiceAtual);
                audio.play().catch(err => console.warn(err));
            } else {
                audio.pause();
            }
            blurAtivo();
        }

        function proxima() {
            if (musicas.length === 0) return;

            if (shuffleAtivo) {
                if (ordemShuffle.length > 0) {
                    historicoShuffle.push(posicaoShuffle);
                }
                posicaoShuffle++;
                if (posicaoShuffle >= ordemShuffle.length) {
                    gerarOrdemShuffle();
                }
                const novoIndice = ordemShuffle[posicaoShuffle];
                carregarMusica(novoIndice, { deShuffle: true });
            } else {
                indiceAtual = (indiceAtual + 1) % musicas.length;
                carregarMusica(indiceAtual);
            }
            audio.play().catch(() => {});
            blurAtivo();
        }

        function anterior() {
            if (musicas.length === 0) return;

            if (shuffleAtivo) {
                if (audio.currentTime > 3) {
                    audio.currentTime = 0;
                    blurAtivo();
                    return;
                }

                if (historicoShuffle.length > 0) {
                    posicaoShuffle = historicoShuffle.pop();
                    const novoIndice = ordemShuffle[posicaoShuffle];
                    carregarMusica(novoIndice, { deShuffle: true });
                } else {
                    audio.currentTime = 0;
                }
            } else {
                if (audio.currentTime > 3) {
                    audio.currentTime = 0;
                    blurAtivo();
                    return;
                }
                indiceAtual = (indiceAtual - 1 + musicas.length) % musicas.length;
                carregarMusica(indiceAtual);
            }
            audio.play().catch(() => {});
            blurAtivo();
        }

        // ============================================================
        //  RENDER DA LISTA
        // ============================================================
        function renderListaMinhas() {
            listaMinhas.innerHTML = '';
            badgeMinhas.textContent = musicas.length;

            if (musicas.length === 0) {
                listaHeader.style.display = 'none';
                dropzone.classList.add('visivel');
                return;
            }
            listaHeader.style.display = 'flex';
            dropzone.classList.remove('visivel');

            const filtradas = filtrarLista(musicas);

            if (filtradas.length === 0) {
                contadorMusicas.textContent = `0 de ${musicas.length} música${musicas.length > 1 ? 's' : ''}`;
                listaMinhas.innerHTML = `
                    <div class="vazio">
                        <span class="icone-grande">🔍</span>
                        <div class="txt">Nenhum resultado para "${escapeHTML(termoBusca)}"</div>
                        <div class="sub">Tente outro título ou artista</div>
                    </div>
                `;
                return;
            }

            contadorMusicas.textContent = termoBusca
                ? `${filtradas.length} de ${musicas.length} música${musicas.length > 1 ? 's' : ''}`
                : `${musicas.length} música${musicas.length > 1 ? 's' : ''}`;

            filtradas.forEach(({ musica, indiceOriginal }) => {
                const ativa = (indiceOriginal === indiceAtual);
                const item = document.createElement('div');
                item.className = 'musica-item' + (ativa ? ' ativa' : '');

                const icone = document.createElement('span');
                icone.className = 'icone';
                const capaUrl = obterURLdaCapa(musica);
                if (capaUrl) {
                    icone.innerHTML = `<img src="${capaUrl}" alt="">`;
                } else {
                    icone.textContent = musica.capa || '🎵';
                }

                const dados = document.createElement('div');
                dados.className = 'dados';
                dados.innerHTML = `
                    <div class="nome">${destacar(musica.titulo)}</div>
                    <div class="duracao">${destacar(musica.artista)}</div>
                `;

                const remover = document.createElement('button');
                remover.className = 'btn-remover';
                remover.textContent = '🗑';
                remover.title = 'Remover';
                remover.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    await removerMusica(musica.id, indiceOriginal);
                });

                item.appendChild(icone);
                item.appendChild(dados);
                item.appendChild(remover);
                item.addEventListener('click', () => {
                    carregarMusica(indiceOriginal);
                    audio.play().catch(() => {});
                    document.querySelector('.aba[data-aba="tocando"]').click();
                });
                listaMinhas.appendChild(item);
            });
        }

        // ============================================================
        //  ADIÇÃO
        // ============================================================
        btnAdicionar.addEventListener('click', () => {
            blurAtivo();
            inputArquivo.click();
        });

        inputArquivo.addEventListener('change', (e) => {
            adicionarArquivos(Array.from(e.target.files));
            inputArquivo.value = '';
        });

        dropzone.addEventListener('click', () => {
            blurAtivo();
            inputArquivo.click();
        });

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('arrastando');
        });

        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('arrastando'));
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('arrastando');
            adicionarArquivos(Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('audio/')));
        });

        document.body.addEventListener('dragover', (e) => e.preventDefault());
        document.body.addEventListener('drop', (e) => {
            e.preventDefault();
            const arquivos = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('audio/'));
            if (arquivos.length > 0) adicionarArquivos(arquivos);
        });

        function adicionarArquivos(arquivos) {
            const validos = arquivos.filter(f =>
                f.type.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac|aac|opus)$/i.test(f.name)
            );
            if (validos.length === 0) {
                alert('Nenhum arquivo de áudio válido selecionado.');
                return;
            }
            arquivosTemp = validos.slice();
            abrirModalProximo();
        }

        async function abrirModalProximo() {
            if (arquivosTemp.length === 0) {
                arquivosTemp = [];
                renderListaMinhas();
                return;
            }
            const arquivo = arquivosTemp[0];
            const url = URL.createObjectURL(arquivo);
            const nomeSugerido = arquivo.name.replace(/\.[^/.]+$/, '');

            inputTitulo.value = nomeSugerido;
            inputArtista.value = 'Desconhecido';
            previewAudio.src = url;
            previewAudio.load();

            capaTemp = null;
            capaPreview.innerHTML = '🎵';
            btnRemoverCapa.style.display = 'none';

            const total = arquivosTemp.length;
            infoFila.textContent = total > 1 ? `1 de ${total} arquivos aguardando` : '';

            modalFundo.dataset.urlTemp = url;
            modalFundo.classList.add('aberto');

            avisoCapa.className = 'aviso-capa';
            avisoCapa.textContent = '🔍 Procurando capa embutida...';

            const capaExtraida = await extrairCapaDoMP3(arquivo);
            if (capaExtraida && arquivosTemp.length > 0 && arquivosTemp[0] === arquivo) {
                capaTemp = capaExtraida;
                const capaUrlTmp = URL.createObjectURL(capaExtraida);
                capaPreview.innerHTML = `<img src="${capaUrlTmp}" alt="">`;
                modalFundo.dataset.capaUrlTemp = capaUrlTmp;
                btnRemoverCapa.style.display = 'block';
                avisoCapa.className = 'aviso-capa detectada';
                avisoCapa.textContent = '✓ Capa detectada automaticamente';
            } else if (capaExtraida === null && arquivosTemp[0] === arquivo) {
                avisoCapa.textContent = 'Nenhuma capa embutida. Você pode escolher uma imagem.';
            }

            inputTitulo.focus();
            inputTitulo.select();
        }

        btnEscolherCapa.addEventListener('click', () => inputCapa.click());
        inputCapa.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                alert('Escolha um arquivo de imagem.');
                return;
            }
            const antiga = modalFundo.dataset.capaUrlTemp;
            if (antiga) URL.revokeObjectURL(antiga);

            capaTemp = file;
            const url = URL.createObjectURL(file);
            capaPreview.innerHTML = `<img src="${url}" alt="">`;
            modalFundo.dataset.capaUrlTemp = url;
            btnRemoverCapa.style.display = 'block';
            avisoCapa.className = 'aviso-capa';
            avisoCapa.textContent = '✓ Capa personalizada';
            inputCapa.value = '';
        });

        btnRemoverCapa.addEventListener('click', () => {
            const antiga = modalFundo.dataset.capaUrlTemp;
            if (antiga) URL.revokeObjectURL(antiga);
            modalFundo.dataset.capaUrlTemp = '';
            capaTemp = null;
            capaPreview.innerHTML = '🎵';
            btnRemoverCapa.style.display = 'none';
            avisoCapa.className = 'aviso-capa';
            avisoCapa.textContent = '';
        });

        btnSalvarModal.addEventListener('click', async () => {
            const url = modalFundo.dataset.urlTemp;
            const tituloVal = inputTitulo.value.trim() || 'Sem título';
            const artistaVal = inputArtista.value.trim() || 'Desconhecido';

            if (arquivosTemp.length === 0) { fecharModal(); return; }

            const arquivo = arquivosTemp[0];
            const nova = {
                titulo: tituloVal,
                artista: artistaVal,
                capa: '🎵',
                blob: arquivo,
                capaBlob: capaTemp,
                ordem: Date.now()
            };

            try {
                const id = await adicionarMusicaDB(nova);
                nova.id = id;
                musicas.push(nova);

                if (musicas.length === 1) carregarMusica(0);
                if (shuffleAtivo) gerarOrdemShuffle();

                renderListaMinhas();
                mostrarStatus('✓ Música salva');

                URL.revokeObjectURL(url);
                const capaUrlTmp = modalFundo.dataset.capaUrlTemp;
                if (capaUrlTmp) URL.revokeObjectURL(capaUrlTmp);

                arquivosTemp.shift();
                if (arquivosTemp.length > 0) {
                    fecharModalSemFila();
                    setTimeout(abrirModalProximo, 100);
                } else {
                    fecharModal();
                }
            } catch (err) {
                console.error(err);
                alert('Erro ao salvar música: ' + err.message);
            }
        });

        btnCancelarModal.addEventListener('click', () => fecharModal());

        function fecharModalSemFila() {
            modalFundo.classList.remove('aberto');
            previewAudio.pause();
            previewAudio.removeAttribute('src');
            const url = modalFundo.dataset.urlTemp;
            if (url) URL.revokeObjectURL(url);
            const capaUrl = modalFundo.dataset.capaUrlTemp;
            if (capaUrl) URL.revokeObjectURL(capaUrl);
            modalFundo.dataset.urlTemp = '';
            modalFundo.dataset.capaUrlTemp = '';
            inputTitulo.value = '';
            inputArtista.value = '';
            capaTemp = null;
            capaPreview.innerHTML = '🎵';
            btnRemoverCapa.style.display = 'none';
            avisoCapa.textContent = '';
        }

        function fecharModal() {
            fecharModalSemFila();
            infoFila.textContent = '';
            arquivosTemp = [];
        }

        modalFundo.addEventListener('click', (e) => {
            if (e.target === modalFundo) fecharModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalFundo.classList.contains('aberto')) fecharModal();
        });
        inputTitulo.addEventListener('keydown', (e) => { if (e.key === 'Enter') inputArtista.focus(); });
        inputArtista.addEventListener('keydown', (e) => { if (e.key === 'Enter') btnSalvarModal.click(); });

        // ============================================================
        //  REMOVER / LIMPAR
        // ============================================================
        async function removerMusica(id, indiceLista) {
            try {
                await removerMusicaDB(id);
                if (objectURLs[id]) {
                    URL.revokeObjectURL(objectURLs[id]);
                    delete objectURLs[id];
                }
                if (capaURLs[id]) {
                    URL.revokeObjectURL(capaURLs[id]);
                    delete capaURLs[id];
                }
                musicas.splice(indiceLista, 1);

                if (shuffleAtivo) gerarOrdemShuffle();

                if (musicas.length === 0) {
                    indiceAtual = 0;
                    carregarMusica(0);
                    audio.pause();
                } else {
                    if (indiceAtual >= musicas.length) indiceAtual = musicas.length - 1;
                    else if (indiceLista < indiceAtual) indiceAtual--;
                    if (indiceLista === indiceAtual || musicas.length === 1) {
                        carregarMusica(indiceAtual);
                        audio.pause();
                    }
                }
                renderListaMinhas();
                mostrarStatus('🗑 Música removida');
            } catch (err) {
                console.error(err);
                alert('Erro ao remover: ' + err.message);
            }
        }

        btnLimpar.addEventListener('click', async () => {
            if (!confirm('Remover TODAS as músicas da sua biblioteca?')) return;
            try {
                await limparDB();
                Object.values(objectURLs).forEach(u => URL.revokeObjectURL(u));
                Object.values(capaURLs).forEach(u => URL.revokeObjectURL(u));
                objectURLs = {};
                capaURLs = {};
                musicas = [];
                indiceAtual = 0;
                shuffleAtivo = false;
                ordemShuffle = [];
                historicoShuffle = [];
                atualizarBotaoShuffle();
                audio.pause();
                carregarMusica(0);
                renderListaMinhas();
                mostrarStatus('🗑 Biblioteca limpa');
            } catch (err) {
                console.error(err);
                alert('Erro ao limpar: ' + err.message);
            }
        });

        // ============================================================
        //  EVENTOS DO PLAYER
        // ============================================================
        btnPlay.addEventListener('click', togglePlay);
        btnProximo.addEventListener('click', proxima);
        btnAnterior.addEventListener('click', anterior);

        audio.addEventListener('play', () => {
            btnPlay.textContent = '⏸';
            capa.classList.add('tocando');
            blurAtivo();
        });
        audio.addEventListener('pause', () => {
            btnPlay.textContent = '▶';
            capa.classList.remove('tocando');
            blurAtivo();
        });
        audio.addEventListener('timeupdate', () => {
            const pct = (audio.currentTime / audio.duration) * 100 || 0;
            progresso.style.width = pct + '%';
            tempoAtual.textContent = formatarTempo(audio.currentTime);
        });
        audio.addEventListener('loadedmetadata', () => {
            tempoTotal.textContent = formatarTempo(audio.duration);
        });
        audio.addEventListener('ended', proxima);

        barraProgresso.addEventListener('click', (e) => {
            const rect = barraProgresso.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            if (audio.duration) audio.currentTime = pct * audio.duration;
        });

        volume.addEventListener('input', () => { audio.volume = volume.value; });

        document.querySelectorAll('.controles, .abas').forEach(el => {
            el.addEventListener('selectstart', (e) => e.preventDefault());
        });

        // ============================================================
        //  INICIALIZAÇÃO
        // ============================================================
        async function init() {
            audio.volume = volume.value;
            atualizarBotaoShuffle();
            try {
                await abrirDB();
                musicas = await listarMusicasDB();
                renderListaMinhas();
                if (musicas.length > 0) carregarMusica(0);
            } catch (err) {
                console.error('Erro ao abrir banco:', err);
                alert('Não foi possível inicializar o banco. Suas músicas não serão salvas.');
            }
        }

        init();
    </script>

</body>
</html>
