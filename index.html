<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Meu App de Música</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }

        .player {
            background: rgba(30, 30, 50, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .capa {
            width: 100%;
            height: 280px;
            border-radius: 20px;
            background: linear-gradient(135deg, #e94560, #903749);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 80px;
            margin-bottom: 25px;
            box-shadow: 0 15px 35px rgba(233, 69, 96, 0.3);
            transition: transform 0.3s;
        }

        .capa.tocando {
            animation: pulsar 2s infinite ease-in-out;
        }

        @keyframes pulsar {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .info {
            text-align: center;
            margin-bottom: 25px;
        }

        .titulo {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .artista {
            font-size: 0.95rem;
            color: #b0b0c0;
        }

        .barra-progresso {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            cursor: pointer;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .progresso {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #e94560, #ff6b8a);
            border-radius: 3px;
            transition: width 0.1s linear;
        }

        .tempos {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #b0b0c0;
            margin-bottom: 20px;
        }

        .controles {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.08);
        }

        .btn-play {
            width: 70px;
            height: 70px;
            font-size: 1.6rem;
            background: linear-gradient(135deg, #e94560, #903749);
            box-shadow: 0 8px 20px rgba(233, 69, 96, 0.4);
        }

        .btn-play:hover {
            background: linear-gradient(135deg, #ff5577, #a04558);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .volume-container span {
            font-size: 1.1rem;
        }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 5px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            background: #e94560;
            border-radius: 50%;
            cursor: pointer;
        }

        .lista {
            max-height: 200px;
            overflow-y: auto;
        }

        .lista::-webkit-scrollbar {
            width: 6px;
        }

        .lista::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .musica-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            gap: 12px;
        }

        .musica-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .musica-item.ativa {
            background: rgba(233, 69, 96, 0.2);
            border-left: 3px solid #e94560;
        }

        .musica-item .icone {
            font-size: 1.2rem;
        }

        .musica-item .dados {
            flex: 1;
        }

        .musica-item .nome {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .musica-item .duracao {
            font-size: 0.75rem;
            color: #b0b0c0;
        }
    </style>
</head>
<body>

    <div class="player">
        <div class="capa" id="capa">🎵</div>

        <div class="info">
            <div class="titulo" id="titulo">Selecione uma música</div>
            <div class="artista" id="artista">—</div>
        </div>

        <div class="barra-progresso" id="barraProgresso">
            <div class="progresso" id="progresso"></div>
        </div>
        <div class="tempos">
            <span id="tempoAtual">0:00</span>
            <span id="tempoTotal">0:00</span>
        </div>

        <div class="controles">
            <button class="btn" id="btnAnterior" title="Anterior">⏮</button>
            <button class="btn btn-play" id="btnPlay" title="Play/Pause">▶</button>
            <button class="btn" id="btnProximo" title="Próxima">⏭</button>
        </div>

        <div class="volume-container">
            <span>🔊</span>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7">
        </div>

        <div class="lista" id="lista"></div>

        <audio id="audio"></audio>
    </div>

    <script>
        // ===== Lista de músicas =====
        const musicas = [
            {
                titulo: "Som de Teste 1",
                artista: "Artista A",
                capa: "🎸",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
            },
            {
                titulo: "Som de Teste 2",
                artista: "Artista B",
                capa: "🎹",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
            },
            {
                titulo: "Som de Teste 3",
                artista: "Artista C",
                capa: "🎺",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
            }
        ];

        // ===== Elementos =====
        const audio = document.getElementById('audio');
        const capa = document.getElementById('capa');
        const titulo = document.getElementById('titulo');
        const artista = document.getElementById('artista');
        const btnPlay = document.getElementById('btnPlay');
        const btnAnterior = document.getElementById('btnAnterior');
        const btnProximo = document.getElementById('btnProximo');
        const progresso = document.getElementById('progresso');
        const barraProgresso = document.getElementById('barraProgresso');
        const tempoAtual = document.getElementById('tempoAtual');
        const tempoTotal = document.getElementById('tempoTotal');
        const volume = document.getElementById('volume');
        const lista = document.getElementById('lista');

        let indiceAtual = 0;

        // ===== Carregar música =====
        function carregarMusica(indice) {
            const musica = musicas[indice];
            audio.src = musica.src;
            titulo.textContent = musica.titulo;
            artista.textContent = musica.artista;
            capa.textContent = musica.capa;
            indiceAtual = indice;
            atualizarLista();
        }

        // ===== Tocar/Pausar =====
        function togglePlay() {
            if (audio.paused) {
                audio.play().catch(err => alert('Erro ao reproduzir: ' + err.message));
            } else {
                audio.pause();
            }
        }

        // ===== Próxima / Anterior =====
        function proxima() {
            indiceAtual = (indiceAtual + 1) % musicas.length;
            carregarMusica(indiceAtual);
            audio.play();
        }

        function anterior() {
            indiceAtual = (indiceAtual - 1 + musicas.length) % musicas.length;
            carregarMusica(indiceAtual);
            audio.play();
        }

        // ===== Formatar tempo =====
        function formatarTempo(seg) {
            if (isNaN(seg)) return '0:00';
            const m = Math.floor(seg / 60);
            const s = Math.floor(seg % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // ===== Atualizar lista =====
        function atualizarLista() {
            lista.innerHTML = '';
            musicas.forEach((musica, i) => {
                const item = document.createElement('div');
                item.className = 'musica-item' + (i === indiceAtual ? ' ativa' : '');
                item.innerHTML = `
                    <span class="icone">${musica.capa}</span>
                    <div class="dados">
                        <div class="nome">${musica.titulo}</div>
                        <div class="duracao">${musica.artista}</div>
                    </div>
                `;
                item.addEventListener('click', () => {
                    carregarMusica(i);
                    audio.play();
                });
                lista.appendChild(item);
            });
        }

        // ===== Eventos =====
        btnPlay.addEventListener('click', togglePlay);
        btnProximo.addEventListener('click', proxima);
        btnAnterior.addEventListener('click', anterior);

        audio.addEventListener('play', () => {
            btnPlay.textContent = '⏸';
            capa.classList.add('tocando');
        });

        audio.addEventListener('pause', () => {
            btnPlay.textContent = '▶';
            capa.classList.remove('tocando');
        });

        audio.addEventListener('timeupdate', () => {
            const pct = (audio.currentTime / audio.duration) * 100 || 0;
            progresso.style.width = pct + '%';
            tempoAtual.textContent = formatarTempo(audio.currentTime);
        });

        audio.addEventListener('loadedmetadata', () => {
            tempoTotal.textContent = formatarTempo(audio.duration);
        });

        audio.addEventListener('ended', proxima);

        barraProgresso.addEventListener('click', (e) => {
            const rect = barraProgresso.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            if (audio.duration) audio.currentTime = pct * audio.duration;
        });

        volume.addEventListener('input', () => {
            audio.volume = volume.value;
        });

        // ===== Inicialização =====
        audio.volume = volume.value;
        carregarMusica(0);
        atualizarLista();
    </script>

</body>
</html>
