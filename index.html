<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Meu App de Música</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px;
        }

        .player {
            background: rgba(30, 30, 50, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .capa {
            width: 100%;
            height: 280px;
            border-radius: 20px;
            background: linear-gradient(135deg, #e94560, #903749);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 80px;
            margin-bottom: 25px;
            box-shadow: 0 15px 35px rgba(233, 69, 96, 0.3);
            transition: transform 0.3s;
            overflow: hidden;
            position: relative;
        }

        .capa img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .capa.tocando {
            animation: pulsar 2s infinite ease-in-out;
        }

        @keyframes pulsar {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .info {
            text-align: center;
            margin-bottom: 25px;
        }

        .titulo {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artista {
            font-size: 0.95rem;
            color: #b0b0c0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .barra-progresso {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            cursor: pointer;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .progresso {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #e94560, #ff6b8a);
            border-radius: 3px;
            transition: width 0.1s linear;
        }

        .tempos {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #b0b0c0;
            margin-bottom: 20px;
        }

        .controles {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.08);
        }

        .btn-play {
            width: 70px;
            height: 70px;
            font-size: 1.6rem;
            background: linear-gradient(135deg, #e94560, #903749);
            box-shadow: 0 8px 20px rgba(233, 69, 96, 0.4);
        }

        .btn-play:hover {
            background: linear-gradient(135deg, #ff5577, #a04558);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .volume-container span {
            font-size: 1.1rem;
        }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 5px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            background: #e94560;
            border-radius: 50%;
            cursor: pointer;
        }

        .btn-adicionar {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 2px dashed rgba(233, 69, 96, 0.6);
            background: rgba(233, 69, 96, 0.1);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .btn-adicionar:hover {
            background: rgba(233, 69, 96, 0.25);
            border-color: #e94560;
            transform: translateY(-2px);
        }

        .lista-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: #b0b0c0;
        }

        .btn-limpar {
            background: transparent;
            border: none;
            color: #ff6b8a;
            cursor: pointer;
            font-size: 0.8rem;
            text-decoration: underline;
        }

        .btn-limpar:hover {
            color: #ff5577;
        }

        .lista {
            max-height: 220px;
            overflow-y: auto;
        }

        .lista::-webkit-scrollbar {
            width: 6px;
        }

        .lista::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .musica-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            gap: 12px;
            position: relative;
        }

        .musica-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .musica-item.ativa {
            background: rgba(233, 69, 96, 0.2);
            border-left: 3px solid #e94560;
        }

        .musica-item .icone {
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .musica-item .dados {
            flex: 1;
            min-width: 0;
        }

        .musica-item .nome {
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .musica-item .duracao {
            font-size: 0.75rem;
            color: #b0b0c0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-remover {
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .btn-remover:hover {
            color: #ff5577;
            background: rgba(255, 85, 119, 0.15);
        }

        .dropzone {
            display: none;
            border: 2px dashed rgba(233, 69, 96, 0.5);
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            color: #b0b0c0;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .dropzone.visivel {
            display: block;
        }

        .dropzone:hover, .dropzone.arrastando {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.1);
        }

        .dropzone .icone-grande {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 10px;
        }

        .modal-fundo {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-fundo.aberto {
            display: flex;
        }

        .modal {
            background: #1e1e32;
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 380px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .modal h3 {
            margin-bottom: 18px;
            font-size: 1.1rem;
            text-align: center;
        }

        .modal label {
            display: block;
            font-size: 0.8rem;
            color: #b0b0c0;
            margin-bottom: 6px;
            margin-top: 12px;
        }

        .modal input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .modal input[type="text"]:focus {
            border-color: #e94560;
        }

        .modal .preview {
            margin-top: 18px;
        }

        .modal .preview audio {
            width: 100%;
            height: 40px;
            border-radius: 10px;
        }

        .modal .info-fila {
            text-align: center;
            font-size: 0.75rem;
            color: #b0b0c0;
            margin-top: 10px;
        }

        .modal-botoes {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-botoes button {
            flex: 1;
            padding: 11px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-cancelar {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-cancelar:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-salvar {
            background: linear-gradient(135deg, #e94560, #903749);
            color: #fff;
        }

        .btn-salvar:hover {
            background: linear-gradient(135deg, #ff5577, #a04558);
        }

        /* Indicador de salvamento */
        .status-salvo {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(40, 200, 100, 0.95);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
            z-index: 200;
        }

        .status-salvo.visivel {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="player">
        <div class="capa" id="capa">🎵</div>

        <div class="info">
            <div class="titulo" id="titulo">Carregando...</div>
            <div class="artista" id="artista">—</div>
        </div>

        <div class="barra-progresso" id="barraProgresso">
            <div class="progresso" id="progresso"></div>
        </div>
        <div class="tempos">
            <span id="tempoAtual">0:00</span>
            <span id="tempoTotal">0:00</span>
        </div>

        <div class="controles">
            <button class="btn" id="btnAnterior" title="Anterior">⏮</button>
            <button class="btn btn-play" id="btnPlay" title="Play/Pause">▶</button>
            <button class="btn" id="btnProximo" title="Próxima">⏭</button>
        </div>

        <div class="volume-container">
            <span>🔊</span>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7">
        </div>

        <button class="btn-adicionar" id="btnAdicionar">➕ Adicionar músicas</button>
        <input type="file" id="inputArquivo" accept="audio/*" multiple hidden>

        <div class="dropzone" id="dropzone">
            <span class="icone-grande">🎧</span>
            Arraste arquivos de áudio aqui<br>ou clique em "Adicionar músicas"
        </div>

        <div class="lista-header" id="listaHeader" style="display:none;">
            <span id="contadorMusicas">0 músicas</span>
            <button class="btn-limpar" id="btnLimpar">Limpar tudo</button>
        </div>

        <div class="lista" id="lista"></div>

        <audio id="audio"></audio>
    </div>

    <div class="modal-fundo" id="modalFundo">
        <div class="modal">
            <h3>🎵 Detalhes da música</h3>
            <label for="inputTitulo">Título</label>
            <input type="text" id="inputTitulo" placeholder="Nome da música">
            <label for="inputArtista">Artista</label>
            <input type="text" id="inputArtista" placeholder="Nome do artista">
            <div class="preview">
                <audio id="previewAudio" controls></audio>
            </div>
            <div class="info-fila" id="infoFila"></div>
            <div class="modal-botoes">
                <button class="btn-cancelar" id="btnCancelarModal">Cancelar</button>
                <button class="btn-salvar" id="btnSalvarModal">Salvar</button>
            </div>
        </div>
    </div>

    <div class="status-salvo" id="statusSalvo">✓ Música salva</div>

    <script>
        // ============================================================
        //  BANCO DE DADOS (IndexedDB) — persiste as músicas no navegador
        // ============================================================
        const DB_NOME = 'AppMusicaDB';
        const DB_VERSAO = 1;
        const STORE = 'musicas';
        let db = null;

        function abrirDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NOME, DB_VERSAO);
                req.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains(STORE)) {
                        const store = database.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
                        store.createIndex('ordem', 'ordem');
                    }
                };
                req.onsuccess = (e) => { db = e.target.result; resolve(db); };
                req.onerror = (e) => reject(e.target.error);
            });
        }

        function listarMusicasDB() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE, 'readonly');
                const store = tx.objectStore(STORE);
                const req = store.getAll();
                req.onsuccess = () => {
                    const resultado = req.result.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
                    resolve(resultado);
                };
                req.onerror = () => reject(req.error);
            });
        }

        function adicionarMusicaDB(musica) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE, 'readwrite');
                const store = tx.objectStore(STORE);
                const req = store.add(musica);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function removerMusicaDB(id) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE, 'readwrite');
                const store = tx.objectStore(STORE);
                const req = store.delete(id);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        function limparDB() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE, 'readwrite');
                const store = tx.objectStore(STORE);
                const req = store.clear();
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        // ============================================================
        //  ESTADO DA APLICAÇÃO
        // ============================================================
        let musicas = [];      // {id, titulo, artista, capa, blob, ordem}
        let indiceAtual = 0;
        let arquivosTemp = []; // fila de arquivos aguardando cadastro
        let objectURLs = {};   // cache de URLs de blob por id

        // ============================================================
        //  ELEMENTOS
        // ============================================================
        const audio = document.getElementById('audio');
        const capa = document.getElementById('capa');
        const titulo = document.getElementById('titulo');
        const artista = document.getElementById('artista');
        const btnPlay = document.getElementById('btnPlay');
        const btnAnterior = document.getElementById('btnAnterior');
        const btnProximo = document.getElementById('btnProximo');
        const progresso = document.getElementById('progresso');
        const barraProgresso = document.getElementById('barraProgresso');
        const tempoAtual = document.getElementById('tempoAtual');
        const tempoTotal = document.getElementById('tempoTotal');
        const volume = document.getElementById('volume');
        const lista = document.getElementById('lista');
        const btnAdicionar = document.getElementById('btnAdicionar');
        const inputArquivo = document.getElementById('inputArquivo');
        const dropzone = document.getElementById('dropzone');
        const listaHeader = document.getElementById('listaHeader');
        const contadorMusicas = document.getElementById('contadorMusicas');
        const btnLimpar = document.getElementById('btnLimpar');
        const statusSalvo = document.getElementById('statusSalvo');

        const modalFundo = document.getElementById('modalFundo');
        const inputTitulo = document.getElementById('inputTitulo');
        const inputArtista = document.getElementById('inputArtista');
        const previewAudio = document.getElementById('previewAudio');
        const infoFila = document.getElementById('infoFila');
        const btnCancelarModal = document.getElementById('btnCancelarModal');
        const btnSalvarModal = document.getElementById('btnSalvarModal');

        // ============================================================
        //  UTILITÁRIOS
        // ============================================================
        function formatarTempo(seg) {
            if (isNaN(seg) || !isFinite(seg)) return '0:00';
            const m = Math.floor(seg / 60);
            const s = Math.floor(seg % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function obterURLdaMusica(musica) {
            // Cache de URL de objeto por id (evita recriar toda hora)
            if (!musica.blob) return null;
            if (!objectURLs[musica.id]) {
                objectURLs[musica.id] = URL.createObjectURL(musica.blob);
            }
            return objectURLs[musica.id];
        }

        function mostrarStatus(mensagem) {
            statusSalvo.textContent = mensagem;
            statusSalvo.classList.add('visivel');
            clearTimeout(mostrarStatus._t);
            mostrarStatus._t = setTimeout(() => statusSalvo.classList.remove('visivel'), 2000);
        }

        // ============================================================
        //  CARREGAR / TOCAR
        // ============================================================
        function carregarMusica(indice) {
            if (musicas.length === 0) {
                titulo.textContent = 'Nenhuma música';
                artista.textContent = '—';
                capa.innerHTML = '🎵';
                audio.removeAttribute('src');
                audio.load();
                progresso.style.width = '0%';
                tempoAtual.textContent = '0:00';
                tempoTotal.textContent = '0:00';
                btnPlay.textContent = '▶';
                capa.classList.remove('tocando');
                return;
            }
            if (indice < 0) indice = 0;
            if (indice >= musicas.length) indice = musicas.length - 1;

            const musica = musicas[indice];
            const url = obterURLdaMusica(musica);
            audio.src = url;
            titulo.textContent = musica.titulo;
            artista.textContent = musica.artista;
            capa.textContent = musica.capa || '🎵';
            indiceAtual = indice;
            atualizarLista();
        }

        function togglePlay() {
            if (musicas.length === 0) { btnAdicionar.click(); return; }
            if (audio.paused) audio.play().catch(err => console.warn(err));
            else audio.pause();
        }

        function proxima() {
            if (musicas.length === 0) return;
            indiceAtual = (indiceAtual + 1) % musicas.length;
            carregarMusica(indiceAtual);
            audio.play().catch(() => {});
        }

        function anterior() {
            if (musicas.length === 0) return;
            indiceAtual = (indiceAtual - 1 + musicas.length) % musicas.length;
            carregarMusica(indiceAtual);
            audio.play().catch(() => {});
        }

        // ============================================================
        //  LISTA
        // ============================================================
        function atualizarLista() {
            lista.innerHTML = '';

            if (musicas.length === 0) {
                listaHeader.style.display = 'none';
                dropzone.classList.add('visivel');
                return;
            }
            listaHeader.style.display = 'flex';
            dropzone.classList.remove('visivel');
            contadorMusicas.textContent = `${musicas.length} música${musicas.length > 1 ? 's' : ''}`;

            musicas.forEach((musica, i) => {
                const item = document.createElement('div');
                item.className = 'musica-item' + (i === indiceAtual ? ' ativa' : '');

                const icone = document.createElement('span');
                icone.className = 'icone';
                icone.textContent = musica.capa || '🎵';

                const dados = document.createElement('div');
                dados.className = 'dados';
                dados.innerHTML = `
                    <div class="nome">${escapeHTML(musica.titulo)}</div>
                    <div class="duracao">${escapeHTML(musica.artista)}</div>
                `;

                const remover = document.createElement('button');
                remover.className = 'btn-remover';
                remover.textContent = '🗑';
                remover.title = 'Remover';
                remover.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    await removerMusica(musica.id, i);
                });

                item.appendChild(icone);
                item.appendChild(dados);
                item.appendChild(remover);
                item.addEventListener('click', () => {
                    carregarMusica(i);
                    audio.play().catch(() => {});
                });
                lista.appendChild(item);
            });
        }

        function escapeHTML(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[c]));
        }

        // ============================================================
        //  ADIÇÃO
        // ============================================================
        btnAdicionar.addEventListener('click', () => inputArquivo.click());
        inputArquivo.addEventListener('change', (e) => {
            adicionarArquivos(Array.from(e.target.files));
            inputArquivo.value = '';
        });

        dropzone.addEventListener('click', () => inputArquivo.click());
        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('arrastando');
        });
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('arrastando'));
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('arrastando');
            adicionarArquivos(Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('audio/')));
        });

        document.body.addEventListener('dragover', (e) => e.preventDefault());
        document.body.addEventListener('drop', (e) => {
            e.preventDefault();
            const arquivos = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('audio/'));
            if (arquivos.length > 0) adicionarArquivos(arquivos);
        });

        function adicionarArquivos(arquivos) {
            const validos = arquivos.filter(f =>
                f.type.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac|aac|opus)$/i.test(f.name)
            );
            if (validos.length === 0) {
                alert('Nenhum arquivo de áudio válido selecionado.');
                return;
            }
            arquivosTemp = validos.slice();
            abrirModalProximo();
        }

        function abrirModalProximo() {
            if (arquivosTemp.length === 0) {
                arquivosTemp = [];
                atualizarLista();
                return;
            }
            const arquivo = arquivosTemp[0];
            const url = URL.createObjectURL(arquivo);
            const nomeSugerido = arquivo.name.replace(/\.[^/.]+$/, '');

            inputTitulo.value = nomeSugerido;
            inputArtista.value = 'Desconhecido';
            previewAudio.src = url;
            previewAudio.load();

            const total = arquivosTemp.length;
            infoFila.textContent = total > 1 ? `1 de ${total} arquivos aguardando` : '';

            modalFundo.dataset.urlTemp = url;
            modalFundo.classList.add('aberto');
            inputTitulo.focus();
            inputTitulo.select();
        }

        btnSalvarModal.addEventListener('click', async () => {
            const url = modalFundo.dataset.urlTemp;
            const tituloVal = inputTitulo.value.trim() || 'Sem título';
            const artistaVal = inputArtista.value.trim() || 'Desconhecido';

            if (arquivosTemp.length === 0) { fecharModal(); return; }

            const arquivo = arquivosTemp[0];
            const nova = {
                titulo: tituloVal,
                artista: artistaVal,
                capa: '🎵',
                blob: arquivo,           // Armazena o arquivo em si
                ordem: Date.now()
            };

            try {
                const id = await adicionarMusicaDB(nova);
                nova.id = id;
                musicas.push(nova);

                // Se era a primeira, carregar
                if (musicas.length === 1) carregarMusica(0);
                atualizarLista();

                mostrarStatus('✓ Música salva');

                // Próximo da fila
                URL.revokeObjectURL(url);
                arquivosTemp.shift();
                if (arquivosTemp.length > 0) {
                    fecharModalSemFila();
                    setTimeout(abrirModalProximo, 100);
                } else {
                    fecharModal();
                }
            } catch (err) {
                console.error(err);
                alert('Erro ao salvar música: ' + err.message);
            }
        });

        btnCancelarModal.addEventListener('click', () => fecharModal());

        function fecharModalSemFila() {
            modalFundo.classList.remove('aberto');
            previewAudio.pause();
            previewAudio.removeAttribute('src');
            modalFundo.dataset.urlTemp = '';
            inputTitulo.value = '';
            inputArtista.value = '';
        }

        function fecharModal() {
            const url = modalFundo.dataset.urlTemp;
            if (url) URL.revokeObjectURL(url);
            fecharModalSemFila();
            infoFila.textContent = '';
            arquivosTemp = [];
        }

        modalFundo.addEventListener('click', (e) => {
            if (e.target === modalFundo) fecharModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalFundo.classList.contains('aberto')) fecharModal();
        });
        inputTitulo.addEventListener('keydown', (e) => { if (e.key === 'Enter') inputArtista.focus(); });
        inputArtista.addEventListener('keydown', (e) => { if (e.key === 'Enter') btnSalvarModal.click(); });

        // ============================================================
        //  REMOVER
        // ============================================================
        async function removerMusica(id, indiceLista) {
            try {
                await removerMusicaDB(id);
                // Revogar URL de objeto
                if (objectURLs[id]) {
                    URL.revokeObjectURL(objectURLs[id]);
                    delete objectURLs[id];
                }
                musicas.splice(indiceLista, 1);

                if (musicas.length === 0) {
                    indiceAtual = 0;
                    carregarMusica(0);
                    audio.pause();
                } else if (indiceAtual >= musicas.length) {
                    indiceAtual = musicas.length - 1;
                    carregarMusica(indiceAtual);
                    audio.pause();
                } else if (indiceLista === indiceAtual) {
                    carregarMusica(indiceAtual);
                    audio.pause();
                } else if (indiceLista < indiceAtual) {
                    indiceAtual--;
                }
                atualizarLista();
                mostrarStatus('🗑 Música removida');
            } catch (err) {
                console.error(err);
                alert('Erro ao remover: ' + err.message);
            }
        }

        // ============================================================
        //  LIMPAR TUDO
        // ============================================================
        btnLimpar.addEventListener('click', async () => {
            if (!confirm('Remover TODAS as músicas da lista? Esta ação não pode ser desfeita.')) return;
            try {
                await limparDB();
                Object.values(objectURLs).forEach(u => URL.revokeObjectURL(u));
                objectURLs = {};
                musicas = [];
                indiceAtual = 0;
                audio.pause();
                audio.removeAttribute('src');
                audio.load();
                carregarMusica(0);
                atualizarLista();
                mostrarStatus('🗑 Lista limpa');
            } catch (err) {
                console.error(err);
                alert('Erro ao limpar: ' + err.message);
            }
        });

        // ============================================================
        //  EVENTOS DO PLAYER
        // ============================================================
        btnPlay.addEventListener('click', togglePlay);
        btnProximo.addEventListener('click', proxima);
        btnAnterior.addEventListener('click', anterior);

        audio.addEventListener('play', () => {
            btnPlay.textContent = '⏸';
            capa.classList.add('tocando');
        });
        audio.addEventListener('pause', () => {
            btnPlay.textContent = '▶';
            capa.classList.remove('tocando');
        });
        audio.addEventListener('timeupdate', () => {
            const pct = (audio.currentTime / audio.duration) * 100 || 0;
            progresso.style.width = pct + '%';
            tempoAtual.textContent = formatarTempo(audio.currentTime);
        });
        audio.addEventListener('loadedmetadata', () => {
            tempoTotal.textContent = formatarTempo(audio.duration);
        });
        audio.addEventListener('ended', proxima);

        barraProgresso.addEventListener('click', (e) => {
            const rect = barraProgresso.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            if (audio.duration) audio.currentTime = pct * audio.duration;
        });

        volume.addEventListener('input', () => { audio.volume = volume.value; });

        // ============================================================
        //  INICIALIZAÇÃO
        // ============================================================
        async function init() {
            audio.volume = volume.value;
            try {
                await abrirDB();
                musicas = await listarMusicasDB();
                if (musicas.length > 0) carregarMusica(0);
                else carregarMusica(0);
                atualizarLista();
            } catch (err) {
                console.error('Erro ao abrir banco:', err);
                alert('Não foi possível inicializar o banco de dados. Suas músicas não serão salvas.');
                atualizarLista();
            }
        }

        init();

        // Permite ao usuário confirmar ao sair se houver música tocando
        window.addEventListener('beforeunload', (e) => {
            if (!audio.paused) {
                // Alguns navegadores ignoram isso, mas não custa tentar
                // (evita fechar sem querer com música rolando)
            }
        });
    </script>

</body>
