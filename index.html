<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Meu App de Música</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0a12;
            --bg-mid: #12121f;
            --bg-soft: #1a1a2e;
            --surface: rgba(255, 255, 255, 0.04);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.14);
            --text: #f0f0f5;
            --text-muted: #8a8aa0;
            --text-dim: #5a5a70;
            --accent: #7c5cff;
            --accent-2: #ff4d8d;
            --accent-glow: rgba(124, 92, 255, 0.4);
            --accent-2-glow: rgba(255, 77, 141, 0.35);
            --success: #2dd4a7;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.25);
            --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.35);
            --shadow-lg: 0 24px 64px rgba(0, 0, 0, 0.5);
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

        body {
            background: var(--bg-deep);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: -50%;
            background:
                radial-gradient(circle at 20% 20%, rgba(124, 92, 255, 0.18), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 77, 141, 0.15), transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(45, 212, 167, 0.08), transparent 50%);
            animation: bgFloat 20s ease-in-out infinite;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes bgFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(2%, -2%) rotate(2deg); }
            66% { transform: translate(-2%, 2%) rotate(-2deg); }
        }

        .player {
            background: linear-gradient(180deg, rgba(26, 26, 46, 0.75), rgba(18, 18, 31, 0.85));
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-radius: var(--radius-xl);
            padding: 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            position: relative;
            animation: playerIn 0.6s var(--ease) both;
        }

        @keyframes playerIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .abas {
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: var(--radius-md);
            padding: 5px;
            margin-bottom: 18px;
            border: 1px solid var(--border);
        }

        .aba {
            flex: 1;
            padding: 11px 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 11px;
            transition: all 0.3s var(--ease);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: 0.01em;
        }

        .aba:hover { color: var(--text); background: var(--surface); }

        .aba.ativa {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .aba .badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.68rem;
            font-weight: 600;
            min-width: 22px;
            text-align: center;
        }

        .aba.ativa .badge { background: rgba(255, 255, 255, 0.3); }

        .busca-container {
            position: relative;
            margin-bottom: 16px;
            display: none;
        }

        .busca-container.visivel { display: block; animation: fadeIn 0.3s var(--ease); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .busca-container .lupa {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.95rem;
            color: var(--text-muted);
            pointer-events: none;
            transition: color 0.2s;
        }

        .busca-container input {
            width: 100%;
            padding: 13px 44px 13px 46px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.25);
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.25s var(--ease);
            font-family: inherit;
        }

        .busca-container input::placeholder { color: var(--text-dim); }

        .busca-container input:focus {
            border-color: var(--accent);
            background: rgba(124, 92, 255, 0.06);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .busca-container input:focus ~ .lupa { color: var(--accent); }

        .busca-container .btn-limpar-busca {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%) scale(0.8);
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.95rem;
            cursor: pointer;
            padding: 6px 9px;
            border-radius: 50%;
            display: none;
            transition: all 0.2s var(--ease);
            outline: none;
        }

        .busca-container .btn-limpar-busca:hover {
            color: var(--accent-2);
            background: rgba(255, 77, 141, 0.12);
            transform: translateY(-50%) scale(1);
        }

        .busca-container .btn-limpar-busca.visivel { display: block; }

        .busca-container .atalho {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.68rem;
            color: var(--text-dim);
            background: rgba(255, 255, 255, 0.05);
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            pointer-events: none;
            font-weight: 500;
            letter-spacing: 0.03em;
        }

        .busca-container input:focus ~ .atalho,
        .busca-container input:not(:placeholder-shown) ~ .atalho { display: none; }

        .painel { display: none; }
        .painel.ativo { display: block; animation: fadeIn 0.35s var(--ease); }

        .capa {
            width: 100%;
            aspect-ratio: 1;
            max-height: 260px;
            border-radius: var(--radius-lg);
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 80px;
            margin-bottom: 22px;
            box-shadow: 0 20px 50px rgba(124, 92, 255, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.06) inset;
            transition: transform 0.4s var(--ease);
            overflow: hidden;
            position: relative;
        }

        .capa::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent 60%);
            pointer-events: none;
        }

        .capa img { width: 100%; height: 100%; object-fit: cover; }

        .capa.tocando {
            animation: pulsar 3s ease-in-out infinite;
        }

        @keyframes pulsar {
            0%, 100% { transform: scale(1); box-shadow: 0 20px 50px rgba(124, 92, 255, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.06) inset; }
            50% { transform: scale(1.02); box-shadow: 0 25px 60px rgba(124, 92, 255, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.1) inset; }
        }

        .info { text-align: center; margin-bottom: 22px; }

        .titulo {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.01em;
        }

        .artista {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 400;
        }

        .barra-progresso {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 10px;
            overflow: visible;
            position: relative;
            transition: height 0.25s var(--ease);
        }

        .barra-progresso:hover { height: 8px; }

        .barra-progresso .trilho {
            position: absolute;
            inset: 0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progresso {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            border-radius: 10px;
            position: relative;
            transition: width 0.15s linear;
            overflow: hidden;
        }

        .progresso::before {
            content: '';
            position: absolute;
            top: 0;
            left: -60%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            transform: skewX(-20deg);
        }

        .player.tocando .progresso::before {
            animation: brilhoBarra 2.5s linear infinite;
        }

        @keyframes brilhoBarra {
            0% { left: -60%; }
            100% { left: 120%; }
        }

        .progresso::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-glow), 0 0 0 3px rgba(124, 92, 255, 0.25);
            transition: transform 0.2s var(--ease);
            z-index: 3;
        }

        .barra-progresso:hover .progresso::after,
        .barra-progresso.arrastando .progresso::after {
            transform: translateY(-50%) scale(1);
        }

        .player.tocando .barra-progresso .progresso::after {
            animation: thumbPulse 2s ease-in-out infinite;
        }

        @keyframes thumbPulse {
            0%, 100% { box-shadow: 0 0 10px var(--accent-glow), 0 0 0 3px rgba(124, 92, 255, 0.25); }
            50% { box-shadow: 0 0 16px var(--accent-glow), 0 0 0 5px rgba(124, 92, 255, 0.15); }
        }

        .barra-progresso.arrastando .progresso { transition: none; }

        .tempos {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.02em;
        }

        .tempos span {
            transition: color 0.3s var(--ease), transform 0.3s var(--ease);
            display: inline-block;
        }

        .tempos #tempoAtual {
            color: var(--text);
            font-weight: 600;
        }

        .tempos #tempoAtual.pulso {
            animation: tickTempo 0.35s var(--ease-bounce);
        }

        @keyframes tickTempo {
            0% { transform: scale(1); }
            40% { transform: scale(1.12); color: #fff; }
            100% { transform: scale(1); }
        }

        .equalizador {
            display: none;
            justify-content: center;
            align-items: flex-end;
            gap: 3px;
            height: 14px;
            margin-bottom: 12px;
        }

        .equalizador.ativo { display: flex; }

        .equalizador span {
            width: 3px;
            background: linear-gradient(180deg, var(--accent), var(--accent-2));
            border-radius: 3px;
            animation: onda 1s ease-in-out infinite;
        }

        .equalizador span:nth-child(1) { animation-delay: 0s; height: 40%; }
        .equalizador span:nth-child(2) { animation-delay: 0.15s; height: 80%; }
        .equalizador span:nth-child(3) { animation-delay: 0.3s; height: 55%; }
        .equalizador span:nth-child(4) { animation-delay: 0.45s; height: 90%; }
        .equalizador span:nth-child(5) { animation-delay: 0.6s; height: 65%; }

        @keyframes onda {
            0%, 100% { transform: scaleY(0.3); opacity: 0.6; }
            50% { transform: scaleY(1); opacity: 1; }
        }

        .controles {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.25s var(--ease);
            outline: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
        }

        .btn:hover {
            background: var(--surface-hover);
            transform: scale(1.06);
            border-color: var(--border-strong);
        }

        .btn:active { transform: scale(0.96); }

        .btn:focus-visible {
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .btn-shuffle {
            width: 42px;
            height: 42px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .btn-shuffle.ativo {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            border-color: transparent;
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .btn-shuffle.ativo::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
        }

        .btn-play {
            width: 68px;
            height: 68px;
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--accent), var(--accent-2)) !important;
            border: none !important;
            box-shadow: 0 10px 30px var(--accent-glow), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            color: #fff;
            outline: none !important;
            overflow: visible;
        }

        .btn-play:hover {
            background: linear-gradient(135deg, #8d6fff, #ff6ba3) !important;
            box-shadow: 0 14px 38px var(--accent-glow), 0 0 0 1px rgba(255, 255, 255, 0.15) inset;
            transform: scale(1.05);
        }

        .btn-play:active {
            transform: scale(0.97);
            background: linear-gradient(135deg, var(--accent), var(--accent-2)) !important;
        }

        .btn-play:focus,
        .btn-play:focus-visible {
            outline: none !important;
            box-shadow: 0 10px 30px var(--accent-glow), 0 0 0 1px rgba(255, 255, 255, 0.1) inset !important;
        }

        .btn-play svg,
        .btn svg {
            display: block;
            pointer-events: none;
        }

        /* ===== CONTROLE DE VOLUME COM PORCENTAGEM ===== */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            transition: border-color 0.25s var(--ease), background 0.25s var(--ease);
        }

        .volume-container:hover {
            border-color: var(--border-strong);
            background: rgba(0, 0, 0, 0.25);
        }

        .volume-icone {
            font-size: 1rem;
            color: var(--text-muted);
            transition: color 0.2s, transform 0.2s var(--ease);
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            flex-shrink: 0;
            width: 22px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .volume-container:hover .volume-icone { color: var(--text); }
        .volume-icone:active { transform: scale(0.85); }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            outline: none;
            cursor: pointer;
            /* Variável que controla o preenchimento do trilho */
            --valor-pct: 70%;
            background: linear-gradient(
                90deg,
                var(--accent) 0%,
                var(--accent-2) var(--valor-pct),
                rgba(255, 255, 255, 0.1) var(--valor-pct),
                rgba(255, 255, 255, 0.1) 100%
            );
            transition: background 0.1s linear;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px var(--accent-glow), 0 0 0 3px rgba(124, 92, 255, 0.2);
            transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 2px 12px var(--accent-glow), 0 0 0 4px rgba(124, 92, 255, 0.3);
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px var(--accent-glow), 0 0 0 3px rgba(124, 92, 255, 0.2);
        }

        /* Porcentagem do volume */
        .volume-pct {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text);
            font-variant-numeric: tabular-nums;
            min-width: 38px;
            text-align: right;
            letter-spacing: 0.02em;
            flex-shrink: 0;
            transition: color 0.2s, transform 0.2s var(--ease-bounce);
            user-select: none;
            -webkit-user-select: none;
        }

        .volume-pct.mudo { color: var(--text-dim); }

        /* Animação de tick quando a % muda */
        .volume-pct.pulso {
            animation: tickVolume 0.3s var(--ease-bounce);
        }

        @keyframes tickVolume {
            0% { transform: scale(1); }
            45% { transform: scale(1.15); color: var(--accent-2); }
            100% { transform: scale(1); }
        }

        .btn-adicionar {
            width: 100%;
            padding: 14px;
            border-radius: var(--radius-md);
            border: 2px dashed rgba(124, 92, 255, 0.4);
            background: rgba(124, 92, 255, 0.06);
            color: var(--text);
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s var(--ease);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 18px;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            font-family: inherit;
        }

        .btn-adicionar:hover {
            background: rgba(124, 92, 255, 0.14);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(124, 92, 255, 0.15);
        }

        .btn-adicionar:active { transform: translateY(0); }

        .lista-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.8rem;
            color: var(--text-muted);
            padding: 0 4px;
            font-weight: 500;
        }

        .btn-limpar {
            background: transparent;
            border: none;
            color: var(--accent-2);
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s var(--ease);
            outline: none;
            -webkit-tap-highlight-color: transparent;
            font-family: inherit;
        }

        .btn-limpar:hover {
            color: #ff6ba3;
            background: rgba(255, 77, 141, 0.1);
        }

        .lista {
            max-height: 280px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .lista::-webkit-scrollbar { width: 6px; }
        .lista::-webkit-scrollbar-track { background: transparent; }
        .lista::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
        }
        .lista::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

        .musica-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s var(--ease);
            gap: 12px;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            border: 1px solid transparent;
        }

        .musica-item:hover {
            background: var(--surface);
            border-color: var(--border);
        }

        .musica-item.ativa {
            background: linear-gradient(90deg, rgba(124, 92, 255, 0.15), rgba(255, 77, 141, 0.08));
            border-color: rgba(124, 92, 255, 0.3);
        }

        .musica-item.ativa::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 60%;
            background: linear-gradient(180deg, var(--accent), var(--accent-2));
            border-radius: 0 3px 3px 0;
        }

        .musica-item .icone {
            font-size: 1.2rem;
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(124, 92, 255, 0.2), rgba(255, 77, 141, 0.15));

    <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>

    <script>
        // ============================================================
        //  BANCO DE DADOS (IndexedDB)
        // ============================================================
        const DB_NOME = 'AppMusicaDB';
        const DB_VERSAO = 1;
        const STORE = 'musicas';
        let db = null;

        function abrirDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NOME, DB_VERSAO);
                req.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains(STORE)) {
                        const store = database.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
                        store.createIndex('ordem', 'ordem');
                    }
                };
                req.onsuccess = (e) => { db = e.target.result; resolve(db); };
                req.onerror = (e) => reject(e.target.error);
            });
        }

        function listarMusicasDB() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE, 'readonly');
                const req = tx.objectStore(STORE).getAll();
                req.onsuccess = () => resolve(req.result.sort((a, b) => (a.ordem || 0) - (b.ordem || 0)));
                req.onerror = () => reject(req.error);
            });
        }

        function adicionarMusicaDB(musica) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE, 'readwrite');
                const req = tx.objectStore(STORE).add(musica);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        function removerMusicaDB(id) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE, 'readwrite');
                const req = tx.objectStore(STORE).delete(id);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        function limparDB() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE, 'readwrite');
                const req = tx.objectStore(STORE).clear();
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        // ============================================================
        //  ESTADO
        // ============================================================
        let musicas = [];
        let indiceAtual = 0;
        let arquivosTemp = [];
        let objectURLs = {};
        let capaURLs = {};
        let termoBusca = '';
        let capaTemp = null;

        let shuffleAtivo = false;
        let ordemShuffle = [];
        let posicaoShuffle = 0;
        let historicoShuffle = [];

        let ultimoSegundoMostrado = -1;
        let rafProgresso = null;
        let arrastandoBarra = false;

        // ===== Controle do volume =====
        let ultimoVolumeNaoZero = 0.7;
        let ultimaPctMostrada = -1;

        // ============================================================
        //  ELEMENTOS
        // ============================================================
        const playerEl = document.getElementById('player');
        const audio = document.getElementById('audio');
        const capa = document.getElementById('capa');
        const titulo = document.getElementById('titulo');
        const artista = document.getElementById('artista');
        const btnPlay = document.getElementById('btnPlay');
        const iconePlay = document.getElementById('iconePlay');
        const iconePause = document.getElementById('iconePause');
        const btnAnterior = document.getElementById('btnAnterior');
        const btnProximo = document.getElementById('btnProximo');
        const btnShuffle = document.getElementById('btnShuffle');
        const progresso = document.getElementById('progresso');
        const barraProgresso = document.getElementById('barraProgresso');
        const tempoAtual = document.getElementById('tempoAtual');
        const tempoTotal = document.getElementById('tempoTotal');
        const volume = document.getElementById('volume');
        const volumeIcone = document.getElementById('volumeIcone');
        const volumePct = document.getElementById('volumePct');
        const listaMinhas = document.getElementById('listaMinhas');
        const btnAdicionar = document.getElementById('btnAdicionar');
        const inputArquivo = document.getElementById('inputArquivo');
        const dropzone = document.getElementById('dropzone');
        const listaHeader = document.getElementById('listaHeader');
        const contadorMusicas = document.getElementById('contadorMusicas');
        const btnLimpar = document.getElementById('btnLimpar');
        const badgeMinhas = document.getElementById('badgeMinhas');
        const statusSalvo = document.getElementById('statusSalvo');
        const infoFonteTocando = document.getElementById('infoFonteTocando');
        const equalizador = document.getElementById('equalizador');

        const buscaContainer = document.getElementById('buscaContainer');
        const inputBusca = document.getElementById('inputBusca');
        const btnLimparBusca = document.getElementById('btnLimparBusca');

        const modalFundo = document.getElementById('modalFundo');
        const inputTitulo = document.getElementById('inputTitulo');
        const inputArtista = document.getElementById('inputArtista');
        const previewAudio = document.getElementById('previewAudio');
        const infoFila = document.getElementById('infoFila');
        const btnCancelarModal = document.getElementById('btnCancelarModal');
        const btnSalvarModal = document.getElementById('btnSalvarModal');

        const capaPreview = document.getElementById('capaPreview');
        const btnEscolherCapa = document.getElementById('btnEscolherCapa');
        const btnRemoverCapa = document.getElementById('btnRemoverCapa');
        const inputCapa = document.getElementById('inputCapa');
        const avisoCapa = document.getElementById('avisoCapa');

        // ============================================================
        //  REMOVER FOCO
        // ============================================================
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', (e) => e.preventDefault());
        });

        function blurAtivo() {
            if (document.activeElement && document.activeElement !== inputBusca) {
                document.activeElement.blur();
            }
        }

        // ============================================================
        //  ABAS
        // ============================================================
        document.querySelectorAll('.aba').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.aba').forEach(b => b.classList.remove('ativa'));
                document.querySelectorAll('.painel').forEach(p => p.classList.remove('ativo'));
                btn.classList.add('ativa');
                document.getElementById('painel-' + btn.dataset.aba).classList.add('ativo');
                btn.blur();

                const aba = btn.dataset.aba;
                if (aba === 'tocando') {
                    buscaContainer.classList.remove('visivel');
                } else {
                    buscaContainer.classList.add('visivel');
                }
            });
        });

        // ============================================================
        //  BUSCA
        // ============================================================
        inputBusca.addEventListener('input', () => {
            termoBusca = inputBusca.value.trim();
            btnLimparBusca.classList.toggle('visivel', termoBusca.length > 0);
            renderListaMinhas();
        });

        btnLimparBusca.addEventListener('click', () => {
            inputBusca.value = '';
            termoBusca = '';
            btnLimparBusca.classList.remove('visivel');
            renderListaMinhas();
            inputBusca.focus();
        });

        document.addEventListener('keydown', (e) => {
            const focoEmInput = ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName);
            const abaTocando = document.getElementById('painel-tocando').classList.contains('ativo');

            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                if (abaTocando) document.querySelector('.aba[data-aba="minhas"]').click();
                inputBusca.focus();
                inputBusca.select();
            } else if (e.key === '/' && !focoEmInput) {
                e.preventDefault();
                if (abaTocando) document.querySelector('.aba[data-aba="minhas"]').click();
                inputBusca.focus();
            } else if (e.key === 'Escape' && document.activeElement === inputBusca) {
                if (termoBusca) btnLimparBusca.click();
                else inputBusca.blur();
            }
        });

        function normalizar(txt) {
            return String(txt).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        function filtrarLista(lista) {
            if (!termoBusca) return lista.map((m, i) => ({ musica: m, indiceOriginal: i }));
            const termo = normalizar(termoBusca);
            return lista
                .map((m, i) => ({ musica: m, indiceOriginal: i }))
                .filter(({ musica }) =>
                    normalizar(musica.titulo).includes(termo) ||
                    normalizar(musica.artista).includes(termo)
                );
        }

        function destacar(texto) {
            const escapado = escapeHTML(texto);
            if (!termoBusca) return escapado;
            const termo = normalizar(termoBusca);
            const palavras = termo.split(/\s+/).filter(Boolean);
            let resultado = escapado;
            palavras.forEach(p => {
                const regex = new RegExp('(' + p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
                resultado = resultado.replace(regex, '<mark>$1</mark>');
            });
            return resultado;
        }

        // ============================================================
        //  UTILITÁRIOS
        // ============================================================
        function formatarTempo(seg) {
            if (isNaN(seg) || !isFinite(seg)) return '0:00';
            const m = Math.floor(seg / 60);
            const s = Math.floor(seg % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function escapeHTML(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[c]));
        }

        function obterURLdaMusica(musica) {
            if (!musica.blob) return null;
            if (!objectURLs[musica.id]) objectURLs[musica.id] = URL.createObjectURL(musica.blob);
            return objectURLs[musica.id];
        }

        function obterURLdaCapa(musica) {
            if (!musica.capaBlob) return null;
            if (!capaURLs[musica.id]) capaURLs[musica.id] = URL.createObjectURL(musica.capaBlob);
            return capaURLs[musica.id];
        }

        function mostrarStatus(mensagem, tipo = 'normal') {
            statusSalvo.textContent = mensagem;
            statusSalvo.className = 'status-salvo visivel' + (tipo === 'shuffle' ? ' shuffle' : '');
            clearTimeout(mostrarStatus._t);
            mostrarStatus._t = setTimeout(() => {
                statusSalvo.classList.remove('visivel');
            }, 2000);
        }

        // ============================================================
        //  CONTROLE DE VOLUME (com porcentagem)
        // ============================================================
        function atualizarVolumeUI() {
            const val = parseFloat(volume.value);
            const pct = Math.round(val * 100);

            // Preenchimento do trilho do slider
            volume.style.setProperty('--valor-pct', pct + '%');

            // Texto da porcentagem
            volumePct.textContent = pct + '%';
            volumePct.classList.toggle('mudo', pct === 0);

            // Ícone conforme o nível
            let icone = '🔊';
            if (pct === 0) icone = '🔇';
            else if (pct < 30) icone = '🔈';
            else if (pct < 70) icone = '🔉';
            else icone = '🔊';
            volumeIcone.textContent = icone;

            // Animação de tick só quando a % inteira muda (evita animar a cada 0.01)
            if (pct !== ultimaPctMostrada) {
                ultimaPctMostrada = pct;
                volumePct.classList.remove('pulso');
                void volumePct.offsetWidth;
                volumePct.classList.add('pulso');
            }

            if (val > 0) ultimoVolumeNaoZero = val;
        }

        volume.addEventListener('input', () => {
            audio.volume = parseFloat(volume.value);
            atualizarVolumeUI();
        });

        // Clicar no ícone: mudo / desmudo
        volumeIcone.addEventListener('click', () => {
            const atual = parseFloat(volume.value);
            if (atual > 0) {
                ultimoVolumeNaoZero = atual;
                volume.value = 0;
                audio.volume = 0;
                mostrarStatus('🔇 Mudo');
            } else {
                const restaurar = ultimoVolumeNaoZero || 0.7;
                volume.value = restaurar;
                audio.volume = restaurar;
                mostrarStatus('🔊 Volume restaurado');
            }
            atualizarVolumeUI();
            blurAtivo();
        });

        // ============================================================
        //  ÍCONES PLAY/PAUSE
        // ============================================================
        function atualizarIconePlayPause(tocando) {
            if (tocando) {
                iconePlay.style.display = 'none';
                iconePause.style.display = 'block';
            } else {
                iconePlay.style.display = 'block';
                iconePause.style.display = 'none';
            }
        }

        // ============================================================
        //  ANIMAÇÃO DE PROGRESSO
        // ============================================================
        function loopProgresso() {
            if (!audio.paused && !arrastandoBarra && audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                progresso.style.width = pct + '%';
                atualizarTempoAtual(audio.currentTime);
            }
            rafProgresso = requestAnimationFrame(loopProgresso);
        }

        function atualizarTempoAtual(seg) {
            const segInteiro = Math.floor(seg);
            tempoAtual.textContent = formatarTempo(seg);
            if (segInteiro !== ultimoSegundoMostrado) {
                ultimoSegundoMostrado = segInteiro;
                tempoAtual.classList.remove('pulso');
                void tempoAtual.offsetWidth;
                tempoAtual.classList.add('pulso');
            }
        }

        function iniciarLoopProgresso() {
            if (rafProgresso) cancelAnimationFrame(rafProgresso);
            rafProgresso = requestAnimationFrame(loopProgresso);
        }

        function pararLoopProgresso() {
            if (rafProgresso) {
                cancelAnimationFrame(rafProgresso);
                rafProgresso = null;
            }
        }

        // ============================================================
        //  SHUFFLE
        // ============================================================
        function gerarOrdemShuffle() {
            const indices = musicas.map((_, i) => i);
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
            ordemShuffle = indices;
            posicaoShuffle = 0;
            historicoShuffle = [];

            if (musicas.length > 0) {
                const pos = ordemShuffle.indexOf(indiceAtual);
                if (pos !== -1) {
                    [ordemShuffle[0], ordemShuffle[pos]] = [ordemShuffle[pos], ordemShuffle[0]];
                }
                posicaoShuffle = 0;
            }
        }

        function atualizarBotaoShuffle() {
            if (shuffleAtivo) {
                btnShuffle.classList.add('ativo');
                btnShuffle.title = 'Reprodução aleatória ATIVA (clique para desativar)';
            } else {
                btnShuffle.classList.remove('ativo');
                btnShuffle.title = 'Ativar reprodução aleatória';
            }
        }

        function alternarShuffle() {
            shuffleAtivo = !shuffleAtivo;

            if (shuffleAtivo) {
                gerarOrdemShuffle();
                mostrarStatus('🔀 Aleatório ativado', 'shuffle');
            } else {
                ordemShuffle = [];
                posicaoShuffle = 0;
                historicoShuffle = [];
                mostrarStatus('➡️ Ordem normal', 'normal');
            }

            atualizarBotaoShuffle();
            blurAtivo();
        }

        btnShuffle.addEventListener('click', alternarShuffle);

        // ============================================================
        //  EXTRAIR CAPA DO MP3
        // ============================================================
        function extrairCapaDoMP3(arquivo) {
            return new Promise((resolve) => {
                if (typeof jsmediatags === 'undefined') { resolve(null); return; }
                try {
                    jsmediatags.read(arquivo, {
                        onSuccess: (tag) => {
                            const pic = tag.tags.picture;
                            if (!pic) { resolve(null); return; }
                            const bytes = new Uint8Array(pic.data);
                            const blob = new Blob([bytes], { type: pic.format || 'image/jpeg' });
                            resolve(blob);
                        },
                        onError: () => resolve(null)
                    });
                } catch (e) {
                    resolve(null);
                }
            });
        }

        // ============================================================
        //  CARREGAR / TOCAR
        // ============================================================
        function carregarMusica(indice, opcoes = {}) {
            if (musicas.length === 0) {
                titulo.textContent = 'Nenhuma música';
                artista.textContent = '—';
                capa.innerHTML = '🎵';
                audio.removeAttribute('src');
                audio.load();
                progresso.style.width = '0%';
                tempoAtual.textContent = '0:00';
                tempoTotal.textContent = '0:00';
                atualizarIconePlayPause(false);
                capa.classList.remove('tocando');
                infoFonteTocando.textContent = '—';
                ultimoSegundoMostrado = -1;
                pararLoopProgresso();
                return;
            }
            if (indice < 0) indice = 0;
            if (indice >= musicas.length) indice = musicas.length - 1;

            const musica = musicas[indice];
            audio.src = obterURLdaMusica(musica);
            titulo.textContent = musica.titulo;
            artista.textContent = musica.artista;
            indiceAtual = indice;
            ultimoSegundoMostrado = -1;

            progresso.style.width = '0%';
            tempoAtual.textContent = '0:00';

            if (shuffleAtivo && !opcoes.deShuffle) {
                const pos = ordemShuffle.indexOf(indice);
                if (pos !== -1) posicaoShuffle = pos;
            }

            const capaUrl = obterURLdaCapa(musica);
            if (capaUrl) {
                capa.innerHTML = `<img src="${capaUrl}" alt="capa">`;
            } else {
                capa.textContent = musica.capa || '🎵';
            }

            const sufixoShuffle = shuffleAtivo ? ' 🔀' : '';
            infoFonteTocando.textContent = `📁 Da sua biblioteca (${indice + 1}/${musicas.length})${sufixoShuffle}`;

            renderListaMinhas();
        }

        function togglePlay() {
            if (musicas.length === 0) {
                document.querySelector('.aba[data-aba="minhas"]').click();
                btnAdicionar.click();
                return;
            }
            if (audio.paused) {
                if (!audio.src) carregarMusica(indiceAtual);
                audio.play().catch(err => console.warn(err));
            } else {
                audio.pause();
            }
            blurAtivo();
        }

        function proxima() {
            if (musicas.length === 0) return;

            if (shuffleAtivo) {
                if (ordemShuffle.length > 0) {
                    historicoShuffle.push(posicaoShuffle);
                }
                posicaoShuffle++;
                if (posicaoShuffle >= ordemShuffle.length) {
                    gerarOrdemShuffle();
                }
                const novoIndice = ordemShuffle[posicaoShuffle];
                carregarMusica(novoIndice, { deShuffle: true });
            } else {
                indiceAtual = (indiceAtual + 1) % musicas.length;
                carregarMusica(indiceAtual);
            }
            audio.play().catch(() => {});
            blurAtivo();
        }

        function anterior() {
            if (musicas.length === 0) return;

            if (shuffleAtivo) {
                if (audio.currentTime > 3) {
                    audio.currentTime = 0;
                    blurAtivo();
                    return;
                }
                if (historicoShuffle.length > 0) {
                    posicaoShuffle = historicoShuffle.pop();
                    const novoIndice = ordemShuffle[posicaoShuffle];
                    carregarMusica(novoIndice, { deShuffle: true });
                } else {
                    audio.currentTime = 0;
                }
            } else {
                if (audio.currentTime > 3) {
                    audio.currentTime = 0;
                    blurAtivo();
                    return;
                }
                indiceAtual = (indiceAtual - 1 + musicas.length) % musicas.length;
                carregarMusica(indiceAtual);
            }
            audio.play().catch(() => {});
            blurAtivo();
        }

        // ============================================================
        //  RENDER DA LISTA
        // ============================================================
        function renderListaMinhas() {
            listaMinhas.innerHTML = '';
            badgeMinhas.textContent = musicas.length;

            if (musicas.length === 0) {
                listaHeader.style.display = 'none';
                dropzone.classList.add('visivel');
                return;
            }
            listaHeader.style.display = 'flex';
            dropzone.classList.remove('visivel');

            const filtradas = filtrarLista(musicas);

            if (filtradas.length === 0) {
                contadorMusicas.textContent = `0 de ${musicas.length} música${musicas.length > 1 ? 's' : ''}`;
                listaMinhas.innerHTML = `
                    <div class="vazio">
                        <span class="icone-grande">🔍</span>
                        <div class="txt">Nenhum resultado para "${escapeHTML(termoBusca)}"</div>
                        <div class="sub">Tente outro título ou artista</div>
                    </div>
                `;
                return;
            }

            contadorMusicas.textContent = termoBusca
                ? `${filtradas.length} de ${musicas.length} música${musicas.length > 1 ? 's' : ''}`
                : `${musicas.length} música${musicas.length > 1 ? 's' : ''}`;

            filtradas.forEach(({ musica, indiceOriginal }) => {
                const ativa = (indiceOriginal === indiceAtual);
                const item = document.createElement('div');
                item.className = 'musica-item' + (ativa ? ' ativa' : '');

                const icone = document.createElement('span');
                icone.className = 'icone';
                const capaUrl = obterURLdaCapa(musica);
                if (capaUrl) {
                    icone.innerHTML = `<img src="${capaUrl}" alt="">`;
                } else {
                    icone.textContent = musica.capa || '🎵';
                }

                const dados = document.createElement('div');
                dados.className = 'dados';
                dados.innerHTML = `
                    <div class="nome">${destacar(musica.titulo)}</div>
                    <div class="duracao">${destacar(musica.artista)}</div>
                `;

                const remover = document.createElement('button');
                remover.className = 'btn-remover';
                remover.textContent = '🗑';
                remover.title = 'Remover';
                remover.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    await removerMusica(musica.id, indiceOriginal);
                });

                item.appendChild(icone);
                item.appendChild(dados);
                item.appendChild(remover);
                item.addEventListener('click', () => {
                    carregarMusica(indiceOriginal);
                    audio.play().catch(() => {});
                    document.querySelector('.aba[data-aba="tocando"]').click();
                });
                listaMinhas.appendChild(item);
            });
        }

        // ============================================================
        //  ADIÇÃO
        // ============================================================
        btnAdicionar.addEventListener('click', () => {
            blurAtivo();
            inputArquivo.click();
        });

        inputArquivo.addEventListener('change', (e) => {
            adicionarArquivos(Array.from(e.target.files));
            inputArquivo.value = '';
        });

        dropzone.addEventListener('click', () => {
            blurAtivo();
            inputArquivo.click();
        });

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('arrastando');
        });

        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('arrastando'));
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('arrastando');
            adicionarArquivos(Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('audio/')));
        });

        document.body.addEventListener('dragover', (e) => e.preventDefault());
        document.body.addEventListener('drop', (e) => {
            e.preventDefault();
            const arquivos = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('audio/'));
            if (arquivos.length > 0) adicionarArquivos(arquivos);
        });

        function adicionarArquivos(arquivos) {
            const validos = arquivos.filter(f =>
                f.type.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac|aac|opus)$/i.test(f.name)
            );
            if (validos.length === 0) {
                alert('Nenhum arquivo de áudio válido selecionado.');
                return;
            }
            arquivosTemp = validos.slice();
            abrirModalProximo();
        }

        async function abrirModalProximo() {
            if (arquivosTemp.length === 0) {
                arquivosTemp = [];
                renderListaMinhas();
                return;
            }
            const arquivo = arquivosTemp[0];
            const url = URL.createObjectURL(arquivo);
            const nomeSugerido = arquivo.name.replace(/\.[^/.]+$/, '');

            inputTitulo.value = nomeSugerido;
            inputArtista.value = 'Desconhecido';
            previewAudio.src = url;
            previewAudio.load();

            capaTemp = null;
            capaPreview.innerHTML = '🎵';
            btnRemoverCapa.style.display = 'none';

            const total = arquivosTemp.length;
            infoFila.textContent = total > 1 ? `1 de ${total} arquivos aguardando` : '';

            modalFundo.dataset.urlTemp = url;
            modalFundo.classList.add('aberto');

            avisoCapa.className = 'aviso-capa';
            avisoCapa.textContent = '🔍 Procurando capa embutida...';

            const capaExtraida = await extrairCapaDoMP3(arquivo);
            if (capaExtraida && arquivosTemp.length > 0 && arquivosTemp[0] === arquivo) {
                capaTemp = capaExtraida;
                const capaUrlTmp = URL.createObjectURL(capaExtraida);
                capaPreview.innerHTML = `<img src="${capaUrlTmp}" alt="">`;
                modalFundo.dataset.capaUrlTemp = capaUrlTmp;
                btnRemoverCapa.style.display = 'block';
                avisoCapa.className = 'aviso-capa detectada';
                avisoCapa.textContent = '✓ Capa detectada automaticamente';
            } else if (capaExtraida === null && arquivosTemp[0] === arquivo) {
                avisoCapa.textContent = 'Nenhuma capa embutida. Você pode escolher uma imagem.';
            }

            inputTitulo.focus();
            inputTitulo.select();
        }

        btnEscolherCapa.addEventListener('click', () => inputCapa.click());
        inputCapa.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                alert('Escolha um arquivo de imagem.');
                return;
            }
            const antiga = modalFundo.dataset.capaUrlTemp;
            if (antiga) URL.revokeObjectURL(antiga);

            capaTemp = file;
            const url = URL.createObjectURL(file);
            capaPreview.innerHTML = `<img src="${url}" alt="">`;
            modalFundo.dataset.capaUrlTemp = url;
            btnRemoverCapa.style.display = 'block';
            avisoCapa.className = 'aviso-capa';
            avisoCapa.textContent = '✓ Capa personalizada';
            inputCapa.value = '';
        });

        btnRemoverCapa.addEventListener('click', () => {
            const antiga = modalFundo.dataset.capaUrlTemp;
            if (antiga) URL.revokeObjectURL(antiga);
            modalFundo.dataset.capaUrlTemp = '';
            capaTemp = null;
            capaPreview.innerHTML = '🎵';
            btnRemoverCapa.style.display = 'none';
            avisoCapa.className = 'aviso-capa';
            avisoCapa.textContent = '';
        });

        btnSalvarModal.addEventListener('click', async () => {
            const url = modalFundo.dataset.urlTemp;
            const tituloVal = inputTitulo.value.trim() || 'Sem título';
            const artistaVal = inputArtista.value.trim() || 'Desconhecido';

            if (arquivosTemp.length === 0) { fecharModal(); return; }

            const arquivo = arquivosTemp[0];
            const nova = {
                titulo: tituloVal,
                artista: artistaVal,
                capa: '🎵',
                blob: arquivo,
                capaBlob: capaTemp,
                ordem: Date.now()
            };

            try {
                const id = await adicionarMusicaDB(nova);
                nova.id = id;
                musicas.push(nova);

                if (musicas.length === 1) carregarMusica(0);

                if (shuffleAtivo) gerarOrdemShuffle();

                renderListaMinhas();
                mostrarStatus('✓ Música salva');

                URL.revokeObjectURL(url);
                const capaUrlTmp = modalFundo.dataset.capaUrlTemp;
                if (capaUrlTmp) URL.revokeObjectURL(capaUrlTmp);

                arquivosTemp.shift();
                if (arquivosTemp.length > 0) {
                    fecharModalSemFila();
                    setTimeout(abrirModalProximo, 100);
                } else {
                    fecharModal();
                }
            } catch (err) {
                console.error(err);
                alert('Erro ao salvar música: ' + err.message);
            }
        });

        btnCancelarModal.addEventListener('click', () => fecharModal());

        function fecharModalSemFila() {
            modalFundo.classList.remove('aberto');
            previewAudio.pause();
            previewAudio.removeAttribute('src');
            const url = modalFundo.dataset.urlTemp;
            if (url) URL.revokeObjectURL(url);
            const capaUrl = modalFundo.dataset.capaUrlTemp;
            if (capaUrl) URL.revokeObjectURL(capaUrl);
            modalFundo.dataset.urlTemp = '';
            modalFundo.dataset.capaUrlTemp = '';
            inputTitulo.value = '';
            inputArtista.value = '';
            capaTemp = null;
            capaPreview.innerHTML = '🎵';
            btnRemoverCapa.style.display = 'none';
            avisoCapa.textContent = '';
        }

        function fecharModal() {
            fecharModalSemFila();
            infoFila.textContent = '';
            arquivosTemp = [];
        }

        modalFundo.addEventListener('click', (e) => {
            if (e.target === modalFundo) fecharModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalFundo.classList.contains('aberto')) fecharModal();
        });
        inputTitulo.addEventListener('keydown', (e) => { if (e.key === 'Enter') inputArtista.focus(); });
        inputArtista.addEventListener('keydown', (e) => { if (e.key === 'Enter') btnSalvarModal.click(); });

        // ============================================================
        //  REMOVER / LIMPAR
        // ============================================================
        async function removerMusica(id, indiceLista) {
            try {
                await removerMusicaDB(id);
                if (objectURLs[id]) {
                    URL.revokeObjectURL(objectURLs[id]);
                    delete objectURLs[id];
                }
                if (capaURLs[id]) {
                    URL.revokeObjectURL(capaURLs[id]);
                    delete capaURLs[id];
                }
                musicas.splice(indiceLista, 1);

                if (shuffleAtivo) gerarOrdemShuffle();

                if (musicas.length === 0) {
                    indiceAtual = 0;
                    carregarMusica(0);
                    audio.pause();
                } else {
                    if (indiceAtual >= musicas.length) indiceAtual = musicas.length - 1;
                    else if (indiceLista < indiceAtual) indiceAtual--;
                    if (indiceLista === indiceAtual || musicas.length === 1) {
                        carregarMusica(indiceAtual);
                        audio.pause();
                    }
                }
                renderListaMinhas();
                mostrarStatus('🗑 Música removida');
            } catch (err) {
                console.error(err);
                alert('Erro ao remover: ' + err.message);
            }
        }

        btnLimpar.addEventListener('click', async () => {
            if (!confirm('Remover TODAS as músicas da sua biblioteca?')) return;
            try {
                await limparDB();
                Object.values(objectURLs).forEach(u => URL.revokeObjectURL(u));
                Object.values(capaURLs).forEach(u => URL.revokeObjectURL(u));
                objectURLs = {};
                capaURLs = {};
                musicas = [];
                indiceAtual = 0;
                shuffleAtivo = false;
                ordemShuffle = [];
                historicoShuffle = [];
                atualizarBotaoShuffle();
                audio.pause();
                carregarMusica(0);
                renderListaMinhas();
                mostrarStatus('🗑 Biblioteca limpa');
            } catch (err) {
                console.error(err);
                alert('Erro ao limpar: ' + err.message);
            }
        });

        // ============================================================
        //  EVENTOS DO PLAYER
        // ============================================================
        btnPlay.addEventListener('click', togglePlay);
        btnProximo.addEventListener('click', proxima);
        btnAnterior.addEventListener('click', anterior);

        audio.addEventListener('play', () => {
            atualizarIconePlayPause(true);
            capa.classList.add('tocando');
            playerEl.classList.add('tocando');
            equalizador.classList.add('ativo');
            iniciarLoopProgresso();
            blurAtivo();
        });
        audio.addEventListener('pause', () => {
            atualizarIconePlayPause(false);
            capa.classList.remove('tocando');
            playerEl.classList.remove('tocando');
            equalizador.classList.remove('ativo');
            pararLoopProgresso();
            blurAtivo();
        });
        audio.addEventListener('timeupdate', () => {
            if (audio.paused) {
                const pct = (audio.currentTime / audio.duration) * 100 || 0;
                progresso.style.width = pct + '%';
                atualizarTempoAtual(audio.currentTime);
            }
        });
        audio.addEventListener('loadedmetadata', () => {
            tempoTotal.textContent = formatarTempo(audio.duration);
        });
        audio.addEventListener('ended', proxima);

        // Sincroniza o slider se o volume for alterado por fora
        audio.addEventListener('volumechange', () => {
            const val = audio.volume;
            if (Math.abs(parseFloat(volume.value) - val) > 0.001) {
                volume.value = val;
            }
            atualizarVolumeUI();
        });

        // ============================================================
        //  SEEK / ARRASTAR BARRA
        // ============================================================
        function calcularPctSeek(clientX) {
            const rect = barraProgresso.getBoundingClientRect();
            let pct = (clientX - rect.left) / rect.width;
            return Math.max(0, Math.min(1, pct));
        }

        function aplicarSeek(pct) {
            if (!audio.duration) return;
            progresso.style.width = (pct * 100) + '%';
            tempoAtual.textContent = formatarTempo(pct * audio.duration);
        }

        barraProgresso.addEventListener('click', (e) => {
            const pct = calcularPctSeek(e.clientX);
            if (audio.duration) audio.currentTime = pct * audio.duration;
        });

        barraProgresso.addEventListener('mousedown', (e) => {
            arrastandoBarra = true;
            barraProgresso.classList.add('arrastando');
            aplicarSeek(calcularPctSeek(e.clientX));

            const onMove = (ev) => {
                if (!arrastandoBarra) return;
                aplicarSeek(calcularPctSeek(ev.clientX));
            };
            const onUp = (ev) => {
                if (!arrastandoBarra) return;
                const pct = calcularPctSeek(ev.clientX);
                if (audio.duration) audio.currentTime = pct * audio.duration;
                arrastandoBarra = false;
                barraProgresso.classList.remove('arrastando');
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
            };
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
        });

        barraProgresso.addEventListener('touchstart', (e) => {
            arrastandoBarra = true;
            barraProgresso.classList.add('arrastando');
            const touch = e.touches[0];
            aplicarSeek(calcularPctSeek(touch.clientX));
        }, { passive: true });

        barraProgresso.addEventListener('touchmove', (e) => {
            if (!arrastandoBarra) return;
            const touch = e.touches[0];
            aplicarSeek(calcularPctSeek(touch.clientX));
        }, { passive: true });

        barraProgresso.addEventListener('touchend', (e) => {
            if (!arrastandoBarra) return;
            const touch = e.changedTouches[0];
            const pct = calcularPctSeek(touch.clientX);
            if (audio.duration) audio.currentTime = pct * audio.duration;
            arrastandoBarra = false;
            barraProgresso.classList.remove('arrastando');
        });

        document.querySelectorAll('.controles, .abas').forEach(el => {
            el.addEventListener('selectstart', (e) => e.preventDefault());
        });

        // ============================================================
        //  INICIALIZAÇÃO
        // ============================================================
        async function init() {
            audio.volume = parseFloat(volume.value);
            atualizarBotaoShuffle();
            atualizarVolumeUI();
            try {
                await abrirDB();
                musicas = await listarMusicasDB();
                renderListaMinhas();
                if (musicas.length > 0) carregarMusica(0);
            } catch (err) {
                console.error('Erro ao abrir banco:', err);
                alert('Não foi possível inicializar o banco. Suas músicas não serão salvas.');
            }
        }

        init();
    </script>

</body>
</html>
